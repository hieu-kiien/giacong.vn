name: Day 2 Cloudflare zone IP rule diagnostic

on:
  push:
    branches: [feat/cloudflare-admin-category-api]
    paths:
      - .github/workflows/day2-cloudflare-zone-ip-rule-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Probe zone IP Access Rules API
        shell: bash
        run: |
          set -euo pipefail
          zone_json="$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" 'https://api.cloudflare.com/client/v4/zones?name=kienhieu.id.vn&status=active')"
          echo "$zone_json" | jq '{success,errors,result:[.result[]?|{id,name,status}]}'
          zone_id="$(echo "$zone_json" | jq -r '.result[0].id // empty')"
          test -n "$zone_id"
          ip="$(curl -fsS https://api.ipify.org)"
          endpoint="https://api.cloudflare.com/client/v4/zones/$zone_id/firewall/access_rules/rules"
          echo "Zone IP: $ip"
          response="$(curl -sS -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' "$endpoint" --data "$(jq -nc --arg ip "$ip" '{configuration:{target:"ip",value:$ip},mode:"whitelist",notes:"Temporary Day 2 zone diagnostic; cleanup follows."}')")"
          echo "$response" | jq '{success,errors,messages,result:(.result|if . == null then null else {id,mode,configuration,allowed_modes,notes} end)}'
          rule_id="$(echo "$response" | jq -r '.result.id // empty')"
          if [ -n "$rule_id" ]; then
            curl -sS -X DELETE -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$endpoint/$rule_id" | jq '{success,errors,messages,result}'
          else
            exit 1
          fi
