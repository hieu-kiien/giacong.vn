name: Day 2 browser runtime diagnostic

on:
  push:
    branches: [feat/cloudflare-admin-category-api]
    paths:
      - .github/workflows/day2-browser-runtime-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
      CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Playwright
        run: npx playwright@1.55.0 install --with-deps chromium
      - name: Probe protected staging with Chromium
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/probe.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          const context = await browser.newContext({
            extraHTTPHeaders: {
              'CF-Access-Client-Id': process.env.CLOUDFLARE_ACCESS_CLIENT_ID,
              'CF-Access-Client-Secret': process.env.CLOUDFLARE_ACCESS_CLIENT_SECRET,
            },
          });
          const page = await context.newPage();
          const response = await page.goto('https://admin-staging.kienhieu.id.vn/api/admin/variants/10', {waitUntil:'networkidle', timeout:30000});
          console.log('status=', response?.status());
          console.log('url=', page.url());
          console.log('title=', await page.title());
          console.log('body=', (await page.locator('body').innerText()).slice(0,1000));
          await browser.close();
          EOF
          node /tmp/probe.mjs
