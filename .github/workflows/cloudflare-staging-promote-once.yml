name: Promote tested Cloudflare version to staging once

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/cloudflare-staging-promote-once.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-staging-promotion
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/giacong-lean-commerce
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEW_VERSION_ID: 173773bb-ed45-412f-aef4-d9ec78f3a8cd
      OLD_VERSION_ID: b4693784-d4c4-4659-83ca-1e13b02a6177
      STAGING_ORIGIN: https://giacong-vn-staging.qtu1053.workers.dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/giacong-lean-commerce/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify tested version and rollback point
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler versions view "$NEW_VERSION_ID" --env=staging --json > /tmp/new-version.json
          jq -e --arg id "$NEW_VERSION_ID" '.id == $id' /tmp/new-version.json

          deployment=$(npx wrangler deployments status --env=staging --json)
          echo "$deployment"
          jq -e --arg old "$OLD_VERSION_ID" '
            .versions | length == 1
            and .[0].version_id == $old
            and .[0].percentage == 100
          ' <<<"$deployment"

      - name: Promote tested version to 100 percent staging traffic
        run: >-
          npx wrangler versions deploy
          "$NEW_VERSION_ID@100%"
          --env=staging
          --message="Promote tested Cloudflare-native D1/R2 Lean V1"
          --yes

      - name: Smoke test active staging with automatic rollback on failure
        shell: bash
        run: |
          set -euo pipefail
          rollback() {
            echo "Active staging smoke failed; rolling back to $OLD_VERSION_ID"
            npx wrangler versions deploy "$OLD_VERSION_ID@100%" --env=staging --message="Automatic rollback after staging smoke failure" --yes
          }
          trap rollback ERR

          for path in / /san-pham /san-pham/bot-gao-lut-xay-min /gui-yeu-cau /thue-gia-cong/say-thuc-pham-say; do
            status=$(curl --silent --show-error --location --max-time 25 --output /tmp/active.html --write-out '%{http_code}' "$STAGING_ORIGIN$path")
            echo "$path -> HTTP $status"
            test "$status" = "200"
          done

          curl --fail-with-body --silent --show-error --max-time 25 \
            "$STAGING_ORIGIN/api/catalog/products/bot-gao-lut-xay-min" > /tmp/product.json
          jq -e '
            .product.slug == "bot-gao-lut-xay-min"
            and .product.availableVariantCount == 3
            and .product.startingPrice.price == 78000
            and ([.product.variants[] | select(.sku == "B2B-DEMO-BGL-05" and .isAvailable == true)] | length == 1)
          ' /tmp/product.json

          curl --fail-with-body --silent --show-error --max-time 25 \
            -H 'Content-Type: application/json' \
            --data '{"lines":[{"parentSlug":"bot-gao-lut-xay-min","variantSku":"B2B-DEMO-BGL-05","quantity":25}]}' \
            "$STAGING_ORIGIN/api/gui-yeu-cau/xac-thuc" > /tmp/cart.json
          jq -e '.ok == true and .cart.isSubmittable == true and .cart.pricedSubtotal == 1950000 and .cart.lines[0].unitPrice == 78000' /tmp/cart.json

          media_status=$(curl --silent --show-error --location --max-time 25 --output /tmp/media.bin --write-out '%{http_code}' \
            "$STAGING_ORIGIN/media/products/c5be4fe1-3daa-40ad-b9df-54717ec5c863.jpg")
          echo "R2 media -> HTTP $media_status, bytes=$(wc -c < /tmp/media.bin)"
          test "$media_status" = "200"
          test "$(wc -c < /tmp/media.bin)" -gt 0

          trap - ERR

      - name: Verify new staging deployment is active at 100 percent
        shell: bash
        run: |
          set -euo pipefail
          deployment=$(npx wrangler deployments status --env=staging --json)
          echo "$deployment"
          jq -e --arg new "$NEW_VERSION_ID" '
            .versions | length == 1
            and .[0].version_id == $new
            and .[0].percentage == 100
          ' <<<"$deployment"
