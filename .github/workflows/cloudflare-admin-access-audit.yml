name: Cloudflare admin Access audit

on:
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/cloudflare-admin-access-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-admin-access-audit-\${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit-access:
    name: Audit Access policy (\${{ matrix.admin_domain }})
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        admin_domain:
          - admin-staging.kienhieu.id.vn
          - admin.kienhieu.id.vn
    env:
      CLOUDFLARE_API_TOKEN: \${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: \${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_DOMAIN: \${{ matrix.admin_domain }}

    steps:
      - name: Read exact Access application
        shell: bash
        run: |
          set -euo pipefail
          apps="$(curl --fail-with-body --silent --show-error \
            --get "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/access/apps" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --data-urlencode "domain=$ADMIN_DOMAIN" \
            --data-urlencode "exact=true")"
          echo "$apps" | jq -e '.success == true' >/dev/null
          app_count="$(echo "$apps" | jq '[.result[] | select(.type == "self_hosted" and .domain == env.ADMIN_DOMAIN)] | length')"
          test "$app_count" = "1"
          echo "$apps" | jq -c '.result[] | select(.type == "self_hosted" and .domain == env.ADMIN_DOMAIN) | {id,name,domain,type,aud,session_duration,app_launcher_visible,auto_redirect_to_identity}' \
            | tee /tmp/access-app.json
          app_id="$(jq -r '.id // empty' /tmp/access-app.json)"
          aud="$(jq -r '.aud // empty' /tmp/access-app.json)"
          test -n "$app_id"
          test -n "$aud"
          echo "ACCESS_APP_ID=$app_id" >> "$GITHUB_ENV"
          echo "POLICY_AUD=$aud" >> "$GITHUB_ENV"

      - name: Read Access application policies safely
        shell: bash
        run: |
          set -euo pipefail
          policies="$(curl --fail-with-body --silent --show-error \
            --get "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/access/apps/$ACCESS_APP_ID/policies" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --data-urlencode "per_page=50")"
          echo "$policies" | jq -e '.success == true' >/dev/null

          # Keep identifiers and selector TYPES for diagnosis, but never print
          # email addresses, domains, groups or other selector values.
          echo "$policies" | jq -c '
            [
              .result[] |
              {
                id,
                name,
                decision,
                precedence,
                reusable: (.reusable // false),
                include_selectors: ((.include // []) | map(keys[]) | unique),
                require_selectors: ((.require // []) | map(keys[]) | unique),
                exclude_selectors: ((.exclude // []) | map(keys[]) | unique),
                include_rule_count: ((.include // []) | length),
                require_rule_count: ((.require // []) | length),
                exclude_rule_count: ((.exclude // []) | length)
              }
            ]
          ' | tee /tmp/access-policies-safe.json

          policy_count="$(jq 'length' /tmp/access-policies-safe.json)"
          test "$policy_count" -ge 1
          echo "ACCESS_POLICY_COUNT=$policy_count" >> "$GITHUB_ENV"

      - name: Read Zero Trust organization team domain
        shell: bash
        run: |
          set -euo pipefail
          organization="$(curl --fail-with-body --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/access/organizations" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")"
          echo "$organization" | jq -e '.success == true' >/dev/null
          auth_domain="$(echo "$organization" | jq -r '.result.auth_domain // empty')"
          test -n "$auth_domain"
          case "$auth_domain" in
            https://*) team_domain="\${auth_domain%/}" ;;
            *) team_domain="https://\${auth_domain%/}" ;;
          esac
          echo "TEAM_DOMAIN=$team_domain" >> "$GITHUB_ENV"
          jq -n --arg auth_domain "$auth_domain" '{auth_domain:$auth_domain}' | tee /tmp/access-org.json

      - name: Verify Access JWKS endpoint is reachable and usable
        shell: bash
        run: |
          set -euo pipefail
          jwks="$(curl --fail-with-body --silent --show-error "$TEAM_DOMAIN/cdn-cgi/access/certs")"
          key_count="$(echo "$jwks" | jq '.keys | length')"
          test "$key_count" -ge 1
          echo "$jwks" | jq -e '.keys | all(.[]; (.kid | type == "string" and length > 0) and (.kty | type == "string" and length > 0))' >/dev/null
          jq -n --argjson key_count "$key_count" '{jwks_key_count:$key_count}' | tee /tmp/jwks-state.json

      - name: Publish safe verification summary
        shell: bash
        run: |
          {
            echo "## Cloudflare Access policy audit"
            echo
            echo "No selector values or credentials are printed by this audit."
            echo
            echo "- Admin domain: \`$ADMIN_DOMAIN\`"
            echo "- Team domain: \`$TEAM_DOMAIN\`"
            echo "- Application ID: \`$ACCESS_APP_ID\`"
            echo "- Application AUD: \`$POLICY_AUD\`"
            echo "- Policy count: \`$ACCESS_POLICY_COUNT\`"
            echo "- JWKS signing keys: \`$(jq -r '.jwks_key_count' /tmp/jwks-state.json)\`"
            echo
            echo "### Policy structure"
            jq -r '.[] |
              "- \(.name) [\(.decision)] | include=\((.include_selectors | join(",")) // "none") | require=\((.require_selectors | join(",")) // "none") | exclude=\((.exclude_selectors | join(",")) // "none") | rules=\(.include_rule_count)/\(.require_rule_count)/\(.exclude_rule_count)"' \
              /tmp/access-policies-safe.json
          } >> "$GITHUB_STEP_SUMMARY"
