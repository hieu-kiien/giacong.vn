name: GitNexus safety gate

on:
  pull_request:
    branches: [master]
    paths:
      - "apps/giacong-lean-commerce/src/**"
      - "apps/giacong-lean-commerce/scripts/**"
      - "apps/giacong-lean-commerce/package.json"
      - "apps/giacong-lean-commerce/package-lock.json"
      - "apps/giacong-lean-commerce/wrangler.jsonc"
      - ".gitnexusignore"
      - ".github/workflows/gitnexus-safety.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitnexus-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detect-impact:
    name: GitNexus detect changes
    runs-on: [self-hosted, linux, x64, giacong]
    timeout-minutes: 25

    steps:
      - name: Checkout with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.11.0"

      - name: Install pinned GitNexus
        env:
          GITNEXUS_SKIP_OPTIONAL_GRAMMARS: "1"
        run: npm install --global gitnexus@1.6.9

      - name: Checkout the proposed PR head
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$HEAD_SHA"
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" | tee /tmp/changed-files.txt
          test -s /tmp/changed-files.txt

      - name: Build GitNexus index from proposed tree
        env:
          GITNEXUS_SKIP_OPTIONAL_GRAMMARS: "1"
        shell: bash
        run: |
          set -euo pipefail
          gitnexus analyze . --force --skip-agents-md --skip-skills
          gitnexus status

      - name: Detect changed symbols and verify graph coverage
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          gitnexus detect-changes --scope compare --base-ref "$BASE_SHA" | tee /tmp/gitnexus-detect-changes.txt

          # GitNexus 1.6.9's human formatter prints "No changes detected." when
          # changed_count=0, even when the backend did parse changed files whose
          # hunks do not overlap an indexed symbol (for example module-level
          # imports/config). Do not confuse that with a missing git diff.
          if grep -Fxq "No changes detected." /tmp/gitnexus-detect-changes.txt; then
            gitnexus cypher \
              "MATCH (f:File) WHERE f.filePath STARTS WITH 'apps/giacong-lean-commerce/' RETURN f.filePath AS filePath" \
              --limit 10000 | tee /tmp/gitnexus-indexed-files.txt

            missing=0
            while IFS= read -r file; do
              if [[ "$file" =~ ^apps/giacong-lean-commerce/(src|scripts)/.*\.(cjs|js|jsx|mjs|mts|ts|tsx)$ ]]; then
                if ! grep -Fq "$file" /tmp/gitnexus-indexed-files.txt; then
                  echo "GitNexus graph is missing changed code file: $file" >&2
                  missing=1
                fi
              fi
            done < /tmp/changed-files.txt

            if [[ "$missing" -ne 0 ]]; then
              echo "Changed application/test code is not fully covered by the GitNexus graph; failing closed." >&2
              exit 1
            fi

            echo "GitNexus indexed every changed code file; no changed hunk overlapped an indexed symbol." | tee /tmp/gitnexus-coverage-note.txt
          fi

          {
            echo "## GitNexus change-impact report"
            echo
            echo "Compared PR head with exact base commit \`$BASE_SHA\`."
            if [[ -f /tmp/gitnexus-coverage-note.txt ]]; then
              echo
              cat /tmp/gitnexus-coverage-note.txt
            fi
            echo
            echo '```text'
            cat /tmp/gitnexus-detect-changes.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Structural graph cycle report
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gitnexus check --cycles | tee /tmp/gitnexus-cycles.txt
          {
            echo
            echo "## GitNexus structural cycle report"
            echo
            echo '```text'
            cat /tmp/gitnexus-cycles.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
