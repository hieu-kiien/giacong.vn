name: GitNexus safety gate

on:
  pull_request:
    branches: [master]
    paths:
      - "apps/giacong-lean-commerce/src/**"
      - "apps/giacong-lean-commerce/scripts/**"
      - "apps/giacong-lean-commerce/package.json"
      - "apps/giacong-lean-commerce/package-lock.json"
      - "apps/giacong-lean-commerce/wrangler.jsonc"
      - ".gitnexusignore"
      - ".github/workflows/gitnexus-safety.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitnexus-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detect-impact:
    name: GitNexus detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GITNEXUS_LBUG_BUFFER_POOL_SIZE: "4294967296"

    steps:
      - name: Checkout with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.11.0"

      - name: Install pinned GitNexus
        env:
          GITNEXUS_SKIP_OPTIONAL_GRAMMARS: "1"
        run: npm install --global gitnexus@1.6.10

      - name: Checkout the proposed PR head
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$HEAD_SHA"
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" | tee /tmp/changed-files.txt
          test -s /tmp/changed-files.txt

      - name: Build GitNexus index from proposed tree
        env:
          GITNEXUS_SKIP_OPTIONAL_GRAMMARS: "1"
        shell: bash
        run: |
          set -euo pipefail
          gitnexus analyze . --force --skip-agents-md --skip-skills
          gitnexus status

      - name: Detect changed symbols and affected execution flows
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITNEXUS_SKIP_OPTIONAL_GRAMMARS: "1"
        shell: bash
        run: |
          set -euo pipefail
          runtime_pattern='^apps/giacong-lean-commerce/src/.*\.(cjs|js|jsx|mjs|mts|ts|tsx)$'

          git diff --diff-filter=D --name-only "$BASE_SHA" "$HEAD_SHA" \
            | grep -E "$runtime_pattern" > /tmp/deleted-runtime-files.txt || true
          git diff --diff-filter=ACMRTUXB --name-only "$BASE_SHA" "$HEAD_SHA" \
            | grep -E "$runtime_pattern" > /tmp/nondeleted-runtime-files.txt || true

          gitnexus detect-changes --scope compare --base-ref "$BASE_SHA" | tee /tmp/gitnexus-detect-changes.txt

          if grep -Eq "$runtime_pattern" /tmp/changed-files.txt \
            && grep -Fxq "No changes detected." /tmp/gitnexus-detect-changes.txt; then
            if test -s /tmp/deleted-runtime-files.txt && ! test -s /tmp/nondeleted-runtime-files.txt; then
              echo "Head graph cannot contain deleted symbols; auditing incoming dependencies against the base graph."
              deleted_json="$(node -e 'const fs=require("node:fs"); const files=fs.readFileSync("/tmp/deleted-runtime-files.txt","utf8").trim().split(/\n+/).filter(Boolean); process.stdout.write(JSON.stringify(files));')"

              git checkout --detach "$BASE_SHA"
              gitnexus analyze . --force --skip-agents-md --skip-skills

              query="MATCH (a)-[r:CodeRelation]->(b) WHERE b.filePath IN ${deleted_json} AND a.filePath IS NOT NULL AND NOT (a.filePath IN ${deleted_json}) RETURN 'EXTERNAL_DEPENDENCY' AS finding, a.filePath AS source_file, a.name AS source_symbol, r.type AS relation, b.filePath AS deleted_file, b.name AS deleted_symbol"
              gitnexus cypher "$query" -l 200 | tee /tmp/gitnexus-deleted-impact.txt

              if grep -Fq "EXTERNAL_DEPENDENCY" /tmp/gitnexus-deleted-impact.txt; then
                echo "Deleted runtime source still has incoming dependencies outside the deletion set; failing closed." >&2
                exit 1
              fi

              echo "No external incoming graph dependencies target the deleted runtime files."
              git checkout --detach "$HEAD_SHA"
              gitnexus analyze . --force --skip-agents-md --skip-skills
            else
              echo "GitNexus did not map changed runtime source code to the head graph; failing closed." >&2
              exit 1
            fi
          fi

          {
            echo "## GitNexus change-impact report"
            echo
            echo "Compared PR head with base \`$BASE_SHA\`."
            echo
            echo '```text'
            cat /tmp/gitnexus-detect-changes.txt
            echo '```'
            if test -f /tmp/gitnexus-deleted-impact.txt; then
              echo
              echo "### Deleted-source base-graph audit"
              echo
              echo '```text'
              cat /tmp/gitnexus-deleted-impact.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Structural graph cycle report
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gitnexus check --cycles | tee /tmp/gitnexus-cycles.txt
          {
            echo
            echo "## GitNexus structural cycle report"
            echo
            echo '```text'
            cat /tmp/gitnexus-cycles.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
