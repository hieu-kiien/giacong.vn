name: GitNexus safety gate

on:
  pull_request:
    branches: [master]
    paths:
      - "apps/giacong-lean-commerce/src/**"
      - "apps/giacong-lean-commerce/scripts/**"
      - "apps/giacong-lean-commerce/package.json"
      - "apps/giacong-lean-commerce/package-lock.json"
      - "apps/giacong-lean-commerce/wrangler.jsonc"
      - ".gitnexusignore"
      - ".github/workflows/gitnexus-safety.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitnexus-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detect-impact:
    name: GitNexus detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.11.0"

      - name: Install pinned GitNexus
        env:
          GITNEXUS_SKIP_OPTIONAL_GRAMMARS: "1"
        run: npm install --global gitnexus@1.6.9

      - name: Checkout the proposed PR head
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$HEAD_SHA"
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" | tee /tmp/changed-files.txt
          test -s /tmp/changed-files.txt

      - name: Build GitNexus index from proposed tree
        env:
          GITNEXUS_SKIP_OPTIONAL_GRAMMARS: "1"
        shell: bash
        run: |
          set -euo pipefail
          gitnexus analyze . --force --skip-agents-md --skip-skills
          gitnexus status

      - name: Detect changed symbols and affected execution flows
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          gitnexus detect-changes --scope compare --base-ref "$BASE_SHA" | tee /tmp/gitnexus-detect-changes.txt

          if grep -Eq '^apps/giacong-lean-commerce/src/.*\.(cjs|js|jsx|mjs|mts|ts|tsx)$' /tmp/changed-files.txt \
            && grep -Fxq "No changes detected." /tmp/gitnexus-detect-changes.txt; then
            echo "GitNexus did not map changed runtime source code to the graph; failing closed." >&2
            exit 1
          fi

          {
            echo "## GitNexus change-impact report"
            echo
            echo "Compared PR head with base \`$BASE_SHA\`."
            echo
            echo '```text'
            cat /tmp/gitnexus-detect-changes.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Structural graph cycle report
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gitnexus check --cycles | tee /tmp/gitnexus-cycles.txt
          {
            echo
            echo "## GitNexus structural cycle report"
            echo
            echo '```text'
            cat /tmp/gitnexus-cycles.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
