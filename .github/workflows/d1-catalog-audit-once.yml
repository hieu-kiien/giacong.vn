name: Audit staging D1 catalog once

on:
  push:
    paths:
      - .github/workflows/d1-catalog-audit-once.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_NAME: giacong-vn-catalog-staging
    steps:
      - name: Audit D1 schema
        shell: bash
        run: |
          set -euo pipefail
          npx -y wrangler@4.115.0 d1 execute "$DATABASE_NAME" --remote --json \
            --command="SELECT name, sql FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' AND name NOT LIKE '_cf_%' ORDER BY name;"

      - name: Audit known catalog data
        shell: bash
        run: |
          set -euo pipefail
          for table in categories products product_variants product_prices product_media settings; do
            echo "=== ${table} ==="
            npx -y wrangler@4.115.0 d1 execute "$DATABASE_NAME" --remote --json \
              --command="SELECT * FROM ${table} LIMIT 5;" || true
          done
