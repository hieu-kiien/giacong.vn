name: Cloudflare staging News media acceptance once

# One-time G2 execution marker, re-armed after the protected preview reached the
# Admin boundary but the intentionally challenged custom staging hostname blocked
# application-rendering verification. G2 now verifies read-only rendering through
# the same Access-protected no-traffic preview without weakening the custom edge.

on:
  workflow_run:
    workflows:
      - Cloudflare staging deep QA
    types:
      - completed
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-staging-news-media-acceptance-once
  cancel-in-progress: false

jobs:
  acceptance:
    name: G2 News media operator acceptance
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    defaults:
      run:
        working-directory: apps/giacong-lean-commerce
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
      CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
      STAGING_ORIGIN: ${{ vars.STAGING_ORIGIN || 'https://staging.kienhieu.id.vn' }}
      STAGING_DATABASE: giacong-vn-catalog-staging
      STAGING_WORKER_NAME: giacong-vn-staging
      G2_EVIDENCE_PATH: /tmp/g2-news-media-evidence.json

    steps:
      - name: Checkout accepted staging source
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Gate automatic run to the G2 acceptance change
        id: gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed="$(git diff-tree --no-commit-id --name-only -r -m "$SOURCE_SHA" | sort -u)"
          printf '%s\n' "$changed"
          if grep -Fxq '.github/workflows/cloudflare-staging-news-media-acceptance-once.yml' <<<"$changed"; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "This successful deep-QA run is unrelated to the one-time G2 acceptance change; skipping mutation."
          fi

      - name: Setup Node.js
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/giacong-lean-commerce/package-lock.json

      - name: Install dependencies
        if: steps.gate.outputs.should_run == 'true'
        run: npm ci

      - name: Capture active staging version
        if: steps.gate.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          deployment="$(npx --yes wrangler@4.115.0 deployments status --env=staging --json)"
          active="$(jq -er 'if (.versions | length) == 1 and .versions[0].percentage == 100 then .versions[0].version_id else error("staging must have exactly one 100% active version") end' <<<"$deployment")"
          echo "ACTIVE_STAGING_VERSION=${active}" >> "$GITHUB_ENV"
          echo "Captured active staging version ${active}."

      - name: Prepare Access-protected staging Worker preview
        if: steps.gate.outputs.should_run == 'true'
        id: preview_access
        env:
          G2_PREVIEW_ALIAS: g2-admin
        run: node scripts/prepare-g2-preview-access.mjs

      - name: Prepare preview-only staging Wrangler config
        if: steps.gate.outputs.should_run == 'true'
        env:
          G2_PREVIEW_ACCESS_AUD: ${{ steps.preview_access.outputs.aud }}
          G2_PREVIEW_HOSTNAME: ${{ steps.preview_access.outputs.hostname }}
          WRANGLER_G2_PREVIEW_CONFIG: .wrangler-g2-preview.json
        run: node scripts/prepare-g2-preview-wrangler.mjs

      - name: Build preview-only staging Worker
        if: steps.gate.outputs.should_run == 'true'
        run: npx opennextjs-cloudflare build --env=staging --config=.wrangler-g2-preview.json

      - name: Open temporary preview URL routing
        if: steps.gate.outputs.should_run == 'true'
        run: node scripts/manage-g2-preview-routing.mjs open

      - name: Upload protected preview version without traffic
        if: steps.gate.outputs.should_run == 'true'
        run: npx opennextjs-cloudflare upload --env=staging --config=.wrangler-g2-preview.json --preview-alias=g2-admin

      - name: Verify active staging traffic remained unchanged
        if: steps.gate.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          deployment="$(npx --yes wrangler@4.115.0 deployments status --env=staging --json)"
          active="$(jq -er 'if (.versions | length) == 1 and .versions[0].percentage == 100 then .versions[0].version_id else error("staging must have exactly one 100% active version") end' <<<"$deployment")"
          test "$active" = "$ACTIVE_STAGING_VERSION"
          echo "Active staging traffic remains on ${active}; preview upload did not deploy traffic."

      - name: Verify protected preview reaches Worker admin boundary
        if: steps.gate.outputs.should_run == 'true'
        env:
          ADMIN_STAGING_ORIGIN: ${{ steps.preview_access.outputs.origin }}
        run: node scripts/staging-g2-preview-preflight.mjs

      - name: Run Access-authenticated News media operator acceptance
        if: steps.gate.outputs.should_run == 'true'
        env:
          ADMIN_STAGING_ORIGIN: ${{ steps.preview_access.outputs.origin }}
          STAGING_ORIGIN: ${{ steps.preview_access.outputs.origin }}
        run: node scripts/staging-news-media-operator-qa.mjs

      - name: Verify active staging traffic still unchanged after acceptance
        if: steps.gate.outputs.should_run == 'true' && success()
        shell: bash
        run: |
          set -euo pipefail
          deployment="$(npx --yes wrangler@4.115.0 deployments status --env=staging --json)"
          active="$(jq -er 'if (.versions | length) == 1 and .versions[0].percentage == 100 then .versions[0].version_id else error("staging must have exactly one 100% active version") end' <<<"$deployment")"
          test "$active" = "$ACTIVE_STAGING_VERSION"
          echo "G2 acceptance left active staging traffic unchanged on ${active}."

      - name: Restore persistent preview URL routing state
        if: always() && steps.gate.outputs.should_run == 'true'
        run: node scripts/manage-g2-preview-routing.mjs restore

      - name: Record G2 acceptance evidence
        if: steps.gate.outputs.should_run == 'true' && success()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TRACKING_ISSUE: "70"
          SOURCE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          SOURCE_DEEP_QA_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || github.run_id }}
          ADMIN_PREVIEW_ORIGIN: ${{ steps.preview_access.outputs.origin }}
        run: |
          set -euo pipefail
          test -s "$G2_EVIDENCE_PATH"
          jq -e '.mediaInUseCode == "MEDIA_IN_USE" and .oldAssetD1Status == "deleted" and .oldAssetR2HttpStatus == 404 and .replacementD1Status == "active" and .replacementR2HttpStatus == 200 and .publicArticleHttpStatus == 200' "$G2_EVIDENCE_PATH" >/dev/null

          article_id="$(jq -r '.articleId' "$G2_EVIDENCE_PATH")"
          article_slug="$(jq -r '.articleSlug' "$G2_EVIDENCE_PATH")"
          first_asset_id="$(jq -r '.firstAssetId' "$G2_EVIDENCE_PATH")"
          replacement_asset_id="$(jq -r '.replacementAssetId' "$G2_EVIDENCE_PATH")"
          replacement_url="$(jq -r '.replacementAssetPublicUrl' "$G2_EVIDENCE_PATH")"
          cleanup="$(jq -c '.cleanup' "$G2_EVIDENCE_PATH")"
          observed_at="$(jq -r '.observedAt' "$G2_EVIDENCE_PATH")"
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          deep_qa_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_DEEP_QA_RUN_ID}"

          body=$(cat <<EOF
          G2 News media operator acceptance evidence

          - accepted source SHA: ${SOURCE_SHA}
          - prerequisite deep-QA run: ${deep_qa_url}
          - G2 acceptance run: ${run_url}
          - protected G2 application preview: ${ADMIN_PREVIEW_ORIGIN}
          - active staging Worker version before/after acceptance: ${ACTIVE_STAGING_VERSION}
          - temporary preview URL routing: restored to prior state PASS
          - custom staging edge challenge boundary: preserved; verified separately by G1 PASS
          - article id / slug: ${article_id} / ${article_slug}
          - initial asset id: ${first_asset_id}
          - persisted-thumbnail delete: HTTP 409 MEDIA_IN_USE PASS
          - replacement asset id: ${replacement_asset_id}
          - replacement public URL: ${replacement_url}
          - read-only News application render through protected preview: HTTP 200 PASS
          - old asset D1 state: deleted
          - old asset R2/media route after cleanup: HTTP 404 PASS
          - replacement asset D1 state during acceptance: active
          - replacement asset R2/media route during acceptance: HTTP 200 PASS
          - controlled test-state cleanup: ${cleanup}
          - observed at: ${observed_at}

          The flow kept the challenged custom staging edge unchanged. Operator mutations and read-only rendering checks used the same Service Auth-protected no-traffic preview of the staging Worker, with an explicit temporary D1 admin membership for Admin APIs. Non-Admin writes and the Admin UI remain blocked by the preview Worker gate. Preview URL routing was restored afterwards; the root workers.dev state and active staging version were preserved. D1/R2 post-conditions were verified, and no production resource was mutated.
          EOF
          )
          payload=$(jq -n --arg body "$body" '{body: $body}')
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${TRACKING_ISSUE}/comments" \
            --data "$payload" >/dev/null

          {
            echo "## G2 News media operator acceptance"
            echo
            echo "- Article: \`${article_id}\` / \`${article_slug}\`"
            echo "- Access-protected preview Admin: PASS"
            echo "- Read-only News/media rendering through protected preview: PASS"
            echo "- Custom staging edge challenge boundary preserved: PASS"
            echo "- Preview URL routing restored: PASS"
            echo "- Active staging traffic unchanged: PASS"
            echo "- MEDIA_IN_USE: PASS"
            echo "- Old D1 tombstone + R2 removal: PASS"
            echo "- Replacement D1/R2 state during acceptance: PASS"
            echo "- Evidence recorded in issue #70"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove local preview runtime config
        if: always() && steps.gate.outputs.should_run == 'true'
        run: rm -f .wrangler-g2-preview.json

      - name: Record failed G2 operator acceptance evidence
        if: steps.gate.outputs.should_run == 'true' && failure()
        shell: bash
        working-directory: .
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TRACKING_ISSUE: "70"
          SOURCE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          SOURCE_DEEP_QA_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || github.run_id }}
        run: |
          set -euo pipefail
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          deep_qa_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_DEEP_QA_RUN_ID}"
          observed_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          body=$(cat <<EOF
          G2 News media operator acceptance failure evidence

          - accepted source SHA: ${SOURCE_SHA}
          - prerequisite deep-QA run: ${deep_qa_url}
          - G2 acceptance run: ${run_url}
          - observed at: ${observed_at}

          The protected staging News media operator acceptance did not complete successfully. The workflow attempted to restore the recorded preview URL routing state before retaining this breadcrumb. G2 remains OPEN. Inspect the G2 run before retrying. This breadcrumb contains no credentials or sensitive token values and does not authorize production mutation.
          EOF
          )
          payload=$(jq -n --arg body "$body" '{body: $body}')
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${TRACKING_ISSUE}/comments" \
            --data "$payload" >/dev/null
