name: GitNexus CLI help once

on:
  push:
    branches: [cloudflare-admin-auth-admission]
    paths:
      - ".github/workflows/gitnexus-cli-help-once.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24.11.0"
      - name: Install pinned GitNexus
        run: npm install --global gitnexus@1.6.9
      - name: Index current branch without generated rule edits
        run: gitnexus analyze . --force --skip-agents-md --skip-skills
      - name: Locate the standard-check contract test in the graph
        shell: bash
        run: |
          set -euo pipefail
          gitnexus query \
            "development-port standard check contract packageJson scripts check focused contact catalog service tests" \
            --goal "identify the symbol in scripts/development-port.test.mjs that asserts packageJson.scripts.check" \
            --context "We must perform impact analysis before editing the existing test callback." \
            --content --limit 10 | tee /tmp/query.txt
      - name: Analyze file-local test blast radius
        shell: bash
        run: |
          set -euo pipefail
          gitnexus impact test \
            --direction upstream \
            --file apps/giacong-lean-commerce/scripts/development-port.test.mjs \
            --include-tests --depth 3 --limit 100 | tee /tmp/impact.txt
          {
            echo "## Pre-edit GitNexus impact"
            echo
            echo '```text'
            cat /tmp/impact.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
