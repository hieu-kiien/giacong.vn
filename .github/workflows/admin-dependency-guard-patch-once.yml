name: Admin dependency guard patch once

on:
  push:
    branches: [cloudflare-admin-auth-admission]
    paths:
      - ".github/workflows/admin-dependency-guard-patch-once.yml"

permissions:
  contents: write

jobs:
  patch-commerce-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cloudflare-admin-auth-admission
      - name: Update reviewed runtime dependency allowlist
        shell: python
        run: |
          from pathlib import Path

          path = Path("apps/giacong-lean-commerce/scripts/commerce-foundation.test.mts")
          source = path.read_text()
          old = '''test("the foundation adds no dependency and no forbidden route", async () => {
            const manifest = JSON.parse(await readSource("package.json")) as {
              dependencies: Record<string, string>;
              devDependencies: Record<string, string>;
            };

            assert.deepEqual(
              Object.keys(manifest.dependencies).sort(),
              [
                "@base-ui/react",
                "class-variance-authority",
                "clsx",
                "lucide-react",
                "next",
                "react",
                "react-dom",
                "shadcn",
                "tailwind-merge",
                "tw-animate-css",
              ],
              "the foundation must not add a runtime dependency",
            );'''
          new = '''test("the runtime dependency baseline stays explicit and no forbidden route appears", async () => {
            const manifest = JSON.parse(await readSource("package.json")) as {
              dependencies: Record<string, string>;
              devDependencies: Record<string, string>;
            };

            assert.deepEqual(
              Object.keys(manifest.dependencies).sort(),
              [
                "@base-ui/react",
                "class-variance-authority",
                "clsx",
                "jose",
                "lucide-react",
                "next",
                "react",
                "react-dom",
                "shadcn",
                "tailwind-merge",
                "tw-animate-css",
              ],
              "runtime dependencies must stay on the reviewed allowlist",
            );'''
          if old not in source:
              raise SystemExit("Expected commerce dependency guard not found; refusing broad edit")
          path.write_text(source.replace(old, new, 1))
      - name: Commit exact guard update
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff -- apps/giacong-lean-commerce/scripts/commerce-foundation.test.mts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/giacong-lean-commerce/scripts/commerce-foundation.test.mts
          git commit -m "test(admin): allow reviewed jose runtime dependency"
          git push origin HEAD:cloudflare-admin-auth-admission
