name: Admin dependency guard patch once

on:
  push:
    branches: [cloudflare-admin-auth-admission]
    paths:
      - ".github/workflows/admin-dependency-guard-patch-once.yml"

permissions:
  contents: write

jobs:
  patch-product-detail-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cloudflare-admin-auth-admission
      - name: Update reviewed product-detail runtime dependency allowlist
        shell: python
        run: |
          from pathlib import Path

          path = Path("apps/giacong-lean-commerce/scripts/product-detail.test.mts")
          source = path.read_text()
          start_marker = 'test("the detail page adds no dependency and reserves no forbidden port", async () => {'
          next_marker = 'test("editing a cart line reopens the product configurator and replaces that line", async () => {'
          start = source.find(start_marker)
          end = source.find(next_marker, start + 1)
          if start < 0 or end < 0 or end <= start:
              raise SystemExit("Expected bounded product-detail dependency guard not found")

          before = source[:start]
          block = source[start:end]
          after = source[end:]
          expected = {
              start_marker: 'test("the reviewed runtime dependency baseline and reserved ports stay locked", async () => {',
              '      "clsx",\n      "lucide-react",': '      "clsx",\n      "jose",\n      "lucide-react",',
              '    "the detail page must not add a runtime dependency",': '    "runtime dependencies must stay on the reviewed allowlist",',
          }
          for old, new in expected.items():
              if block.count(old) != 1:
                  raise SystemExit(f"Refusing ambiguous product-detail edit for: {old}")
              block = block.replace(old, new, 1)
          path.write_text(before + block + after)
      - name: Remove one-time impact and patch workflows
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/gitnexus-commerce-test-impact-once.yml
          git rm .github/workflows/admin-dependency-guard-patch-once.yml
      - name: Commit exact reviewed updates
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff -- apps/giacong-lean-commerce/scripts/product-detail.test.mts .github/workflows/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/giacong-lean-commerce/scripts/product-detail.test.mts .github/workflows/
          git commit -m "test(admin): keep reviewed runtime dependency guards strict"
          git push origin HEAD:cloudflare-admin-auth-admission
