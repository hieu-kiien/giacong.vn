name: Admin dependency guard patch once

on:
  push:
    branches: [cloudflare-admin-auth-admission]
    paths:
      - ".github/workflows/admin-dependency-guard-patch-once.yml"

permissions:
  contents: write

jobs:
  patch-product-detail-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cloudflare-admin-auth-admission
      - name: Update reviewed product-detail runtime dependency allowlist
        shell: python
        run: |
          from pathlib import Path

          path = Path("apps/giacong-lean-commerce/scripts/product-detail.test.mts")
          source = path.read_text()
          old = '''test("the detail page adds no dependency and reserves no forbidden port", async () => {
            const manifest = JSON.parse(await readSource("package.json")) as {
              dependencies: Record<string, string>;
              scripts: Record<string, string>;
            };
            assert.deepEqual(
              Object.keys(manifest.dependencies).sort(),
              [
                "@base-ui/react",
                "class-variance-authority",
                "clsx",
                "lucide-react",
                "next",
                "react",
                "react-dom",
                "shadcn",
                "tailwind-merge",
                "tw-animate-css",
              ],
              "the detail page must not add a runtime dependency",
            );'''
          new = '''test("the reviewed runtime dependency baseline and reserved ports stay locked", async () => {
            const manifest = JSON.parse(await readSource("package.json")) as {
              dependencies: Record<string, string>;
              scripts: Record<string, string>;
            };
            assert.deepEqual(
              Object.keys(manifest.dependencies).sort(),
              [
                "@base-ui/react",
                "class-variance-authority",
                "clsx",
                "jose",
                "lucide-react",
                "next",
                "react",
                "react-dom",
                "shadcn",
                "tailwind-merge",
                "tw-animate-css",
              ],
              "runtime dependencies must stay on the reviewed allowlist",
            );'''
          if old not in source:
              raise SystemExit("Expected product-detail dependency guard not found; refusing broad edit")
          path.write_text(source.replace(old, new, 1))
      - name: Remove one-time impact and patch workflows
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/gitnexus-commerce-test-impact-once.yml
          git rm .github/workflows/admin-dependency-guard-patch-once.yml
      - name: Commit exact reviewed updates
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff -- apps/giacong-lean-commerce/scripts/product-detail.test.mts .github/workflows/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/giacong-lean-commerce/scripts/product-detail.test.mts .github/workflows/
          git commit -m "test(admin): keep reviewed runtime dependency guards strict"
          git push origin HEAD:cloudflare-admin-auth-admission
