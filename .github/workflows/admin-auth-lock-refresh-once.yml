name: Admin auth lock refresh once

on:
  push:
    branches: [cloudflare-admin-auth-admission]
    paths:
      - "apps/giacong-lean-commerce/package.json"

permissions:
  contents: write

concurrency:
  group: admin-auth-lock-refresh-once
  cancel-in-progress: false

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: cloudflare-admin-auth-admission

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.11.0"
          cache: npm
          cache-dependency-path: apps/giacong-lean-commerce/package-lock.json

      - name: Refresh lockfile only
        working-directory: apps/giacong-lean-commerce
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit generated lockfile if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- apps/giacong-lean-commerce/package-lock.json; then
            echo "package-lock.json already matches package.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/giacong-lean-commerce/package-lock.json
          git commit -m "chore(admin): refresh auth dependency lockfile"
          git push origin HEAD:cloudflare-admin-auth-admission
