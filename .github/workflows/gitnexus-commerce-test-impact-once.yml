name: GitNexus commerce test impact once

on:
  push:
    branches: [cloudflare-admin-auth-admission]
    paths:
      - ".github/workflows/gitnexus-commerce-test-impact-once.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24.11.0"
      - run: npm install --global gitnexus@1.6.9
      - run: gitnexus analyze . --force --skip-agents-md --skip-skills
      - name: Locate dependency guard in graph
        shell: bash
        run: |
          set -euo pipefail
          gitnexus query \
            "commerce foundation adds no dependency runtime dependency package dependencies" \
            --goal "identify the existing dependency guard in scripts/commerce-foundation.test.mts before changing its allowed dependency baseline" \
            --context "jose is a deliberate Cloudflare Access security dependency; this guard currently rejects any new runtime dependency." \
            --content --limit 10
      - name: Analyze file-node blast radius if addressable
        shell: bash
        run: |
          set -euo pipefail
          gitnexus impact commerce-foundation.test.mts \
            --direction upstream \
            --file apps/giacong-lean-commerce/scripts/commerce-foundation.test.mts \
            --include-tests --depth 3 --limit 100
