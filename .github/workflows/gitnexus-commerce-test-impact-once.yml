name: GitNexus dependency guard impact once

on:
  push:
    branches: [cloudflare-admin-auth-admission]
    paths:
      - ".github/workflows/gitnexus-commerce-test-impact-once.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24.11.0"
      - run: npm install --global gitnexus@1.6.9
      - run: gitnexus analyze . --force --skip-agents-md --skip-skills
      - name: Locate product-detail dependency guard in graph
        shell: bash
        run: |
          set -euo pipefail
          gitnexus query \
            "product detail page adds no dependency runtime dependency package dependencies" \
            --goal "identify the existing dependency allowlist guard in scripts/product-detail.test.mts before adding the reviewed jose security dependency" \
            --context "jose is required for cryptographic Cloudflare Access JWT verification and the guard must remain strict rather than be removed." \
            --content --limit 10
      - name: Analyze product-detail test blast radius
        shell: bash
        run: |
          set -euo pipefail
          gitnexus impact product-detail.test.mts \
            --direction upstream \
            --file apps/giacong-lean-commerce/scripts/product-detail.test.mts \
            --include-tests --depth 3 --limit 100 | tee /tmp/impact.txt
          {
            echo "## Pre-edit GitNexus impact: product-detail dependency guard"
            echo
            echo '```text'
            cat /tmp/impact.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
