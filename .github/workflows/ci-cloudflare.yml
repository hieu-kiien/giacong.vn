name: CI and Cloudflare staging gate

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/giacong-lean-commerce

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/giacong-lean-commerce/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run application checks
        run: npm run check

  staging-gate:
    name: Cloudflare staging gate
    if: github.event_name != 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/giacong-lean-commerce
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/giacong-lean-commerce/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify Cloudflare credentials and existing staging worker
        run: npx --no-install wrangler deployments status --env=staging --json

      - name: Build OpenNext for Cloudflare staging
        run: npm run cf:build:staging

      - name: Validate Wrangler package without deploying
        run: npx --no-install wrangler deploy --env=staging --dry-run --outdir=.wrangler-dry-run

      - name: Staging remains unchanged
        run: echo "Cloudflare staging gate passed. This workflow intentionally does not deploy."
