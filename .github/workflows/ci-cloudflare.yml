name: CI and Cloudflare staging gate

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/giacong-lean-commerce

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/giacong-lean-commerce/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm run audit:prod

      - name: Run application checks
        run: npm run check

  cloudflare-package:
    name: Cloudflare package gate
    if: github.event_name == 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/giacong-lean-commerce

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/giacong-lean-commerce/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build OpenNext for Cloudflare staging
        run: npm run cf:build:staging

      - name: Prepare non-sensitive dry-run secret placeholders
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg url "https://script.google.com/macros/s/dry-run-placeholder/exec" \
            --arg secret "dry-run-placeholder" \
            '{GOOGLE_SHEETS_WEBHOOK_URL: $url, GOOGLE_SHEETS_WEBHOOK_SECRET: $secret}' \
            > /tmp/giacong-staging-dry-run-secrets.json
          chmod 600 /tmp/giacong-staging-dry-run-secrets.json

      - name: Validate Wrangler package without deploying
        run: npx --yes wrangler@4.115.0 deploy --env=staging --dry-run --outdir=.wrangler-dry-run --secrets-file=/tmp/giacong-staging-dry-run-secrets.json

      - name: Remove dry-run secret placeholders
        if: always()
        run: rm -f /tmp/giacong-staging-dry-run-secrets.json

  staging-deploy:
    name: Deploy Cloudflare staging
    if: github.event_name != 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    defaults:
      run:
        working-directory: apps/giacong-lean-commerce
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
      CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
      STAGING_GOOGLE_SHEETS_WEBHOOK_URL: ${{ secrets.STAGING_GOOGLE_SHEETS_WEBHOOK_URL }}
      STAGING_GOOGLE_SHEETS_WEBHOOK_SECRET: ${{ secrets.STAGING_GOOGLE_SHEETS_WEBHOOK_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/giacong-lean-commerce/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prepare ephemeral staging Google delivery secret file
        shell: bash
        run: |
          set -euo pipefail
          test -n "$STAGING_GOOGLE_SHEETS_WEBHOOK_URL"
          test -n "$STAGING_GOOGLE_SHEETS_WEBHOOK_SECRET"
          jq -n \
            --arg url "$STAGING_GOOGLE_SHEETS_WEBHOOK_URL" \
            --arg secret "$STAGING_GOOGLE_SHEETS_WEBHOOK_SECRET" \
            '{GOOGLE_SHEETS_WEBHOOK_URL: $url, GOOGLE_SHEETS_WEBHOOK_SECRET: $secret}' \
            > /tmp/giacong-staging-google-delivery-secrets.json
          chmod 600 /tmp/giacong-staging-google-delivery-secrets.json

      - name: Verify Cloudflare credentials and current staging worker
        run: npx --yes wrangler@4.115.0 deployments status --env=staging --json

      - name: Ensure optional storefront Access Service Auth policy
        env:
          ACCESS_SERVICE_AUTH_DOMAIN: staging.kienhieu.id.vn
          ACCESS_SERVICE_AUTH_POLICY_NAME: GitHub staging deep QA
          ACCESS_SERVICE_AUTH_REQUIRED: "false"
        run: node scripts/ensure-staging-access-service-auth.mjs

      - name: Ensure required staging Admin Access application and Service Auth
        id: admin_access
        env:
          ACCESS_SERVICE_AUTH_DOMAIN: admin-staging.kienhieu.id.vn
          ACCESS_SERVICE_AUTH_POLICY_NAME: GitHub G2 News media acceptance
          ACCESS_SERVICE_AUTH_REQUIRED: "true"
          ACCESS_APPLICATION_CREATE_IF_MISSING: "true"
          ACCESS_APPLICATION_NAME: Giacong staging Admin
        run: node scripts/ensure-staging-access-service-auth.mjs

      - name: Prepare staging Wrangler config with current Admin Access AUD
        env:
          STAGING_ADMIN_ACCESS_AUD: ${{ steps.admin_access.outputs.aud }}
        run: node scripts/prepare-staging-wrangler-access.mjs

      - name: Build OpenNext for Cloudflare staging
        run: npx opennextjs-cloudflare build --env=staging --config=.wrangler-staging-runtime.json

      - name: Validate Wrangler package before changing remote state
        run: npx --yes wrangler@4.115.0 deploy --config=.wrangler-staging-runtime.json --env=staging --dry-run --outdir=.wrangler-dry-run --secrets-file=/tmp/giacong-staging-google-delivery-secrets.json

      - name: Apply pending D1 staging migrations
        run: npx --yes wrangler@4.115.0 d1 migrations apply GIACONG_VN_CATALOG --env=staging --remote

      - name: Deploy the validated OpenNext build to staging
        run: npx opennextjs-cloudflare deploy --env=staging --config=.wrangler-staging-runtime.json --secrets-file=/tmp/giacong-staging-google-delivery-secrets.json

      - name: Verify active staging deployment
        shell: bash
        run: |
          set -euo pipefail
          deployment=$(npx --yes wrangler@4.115.0 deployments status --env=staging --json)
          echo "$deployment"
          jq -e '
            .versions | length == 1
            and .[0].percentage == 100
            and (. [0].version_id | type == "string" and length > 0)
          ' <<<"$deployment"

      - name: Record master staging deployment evidence
        if: github.ref == 'refs/heads/master'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TRACKING_ISSUE: "70"
        run: |
          set -euo pipefail
          deployment=$(npx --yes wrangler@4.115.0 deployments status --env=staging --json)
          version_id=$(jq -er '
            .versions
            | map(select(.percentage == 100))
            | if length == 1 then .[0].version_id else empty end
          ' <<<"$deployment")
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          observed_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          body=$(cat <<EOF
          G1 staging deployment evidence

          - source CI run id: ${GITHUB_RUN_ID}
          - source CI run: ${run_url}
          - master SHA: ${GITHUB_SHA}
          - active staging Worker version: ${version_id}
          - traffic: 100%
          - observed at: ${observed_at}

          This breadcrumb records the deployment immediately after the workflow verified a single 100% active staging version. Deep-QA evidence for the same source CI run is recorded separately after the post-deploy suite succeeds.
          EOF
          )
          payload=$(jq -n --arg body "$body" '{body: $body}')
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${TRACKING_ISSUE}/comments" \
            --data "$payload" >/dev/null

      - name: Remove ephemeral staging Google delivery secret file
        if: always()
        run: rm -f /tmp/giacong-staging-google-delivery-secrets.json

  staging-gate-failure-evidence:
    name: Record failed master staging gate evidence
    if: >-
      ${{ always()
        && github.ref == 'refs/heads/master'
        && github.event_name != 'pull_request'
        && (needs.quality.result != 'success' || needs.staging-deploy.result != 'success') }}
    needs:
      - quality
      - staging-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      QUALITY_RESULT: ${{ needs.quality.result }}
      STAGING_DEPLOY_RESULT: ${{ needs.staging-deploy.result }}
      GITHUB_TOKEN: ${{ github.token }}
      TRACKING_ISSUE: "70"

    steps:
      - name: Record failed master staging gate evidence
        shell: bash
        run: |
          set -euo pipefail
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          observed_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          body=$(cat <<EOF
          G1 staging gate failure evidence

          - source CI run id: ${GITHUB_RUN_ID}
          - source CI run: ${run_url}
          - master SHA: ${GITHUB_SHA}
          - Quality gate result: ${QUALITY_RESULT}
          - staging deploy result: ${STAGING_DEPLOY_RESULT}
          - observed at: ${observed_at}

          G1 remains OPEN. Inspect the source CI run before retrying or changing staging. This breadcrumb records failure state only; it is not acceptance evidence and it does not authorize production mutation.
          EOF
          )
          payload=$(jq -n --arg body "$body" '{body: $body}')
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${TRACKING_ISSUE}/comments" \
            --data "$payload" >/dev/null
