name: CI and Cloudflare staging gate

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/giacong-lean-commerce

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/giacong-lean-commerce/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm run audit:prod

      - name: Run application checks
        run: npm run check

  cloudflare-package:
    name: Cloudflare package gate
    if: github.event_name == 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/giacong-lean-commerce

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/giacong-lean-commerce/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build OpenNext for Cloudflare staging
        run: npm run cf:build:staging

      - name: Validate Wrangler package without deploying
        run: npx --yes wrangler@4.115.0 deploy --env=staging --dry-run --outdir=.wrangler-dry-run

  staging-deploy:
    name: Deploy Cloudflare staging
    if: github.event_name != 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    defaults:
      run:
        working-directory: apps/giacong-lean-commerce
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
      CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/giacong-lean-commerce/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify Cloudflare credentials and current staging worker
        run: npx --yes wrangler@4.115.0 deployments status --env=staging --json

      - name: Ensure staging Access Service Auth policy
        run: node scripts/ensure-staging-access-service-auth.mjs

      - name: Build OpenNext for Cloudflare staging
        run: npm run cf:build:staging

      - name: Validate Wrangler package before changing remote state
        run: npx --yes wrangler@4.115.0 deploy --env=staging --dry-run --outdir=.wrangler-dry-run

      - name: Apply pending D1 staging migrations
        run: npx --yes wrangler@4.115.0 d1 migrations apply GIACONG_VN_CATALOG --env=staging --remote

      - name: Deploy the validated OpenNext build to staging
        run: npx opennextjs-cloudflare deploy --env=staging

      - name: Verify active staging deployment
        shell: bash
        run: |
          set -euo pipefail
          deployment=$(npx --yes wrangler@4.115.0 deployments status --env=staging --json)
          echo "$deployment"
          jq -e '
            .versions | length == 1
            and .[0].percentage == 100
            and (. [0].version_id | type == "string" and length > 0)
          ' <<<"$deployment"

      - name: Record master staging deployment evidence
        if: github.ref == 'refs/heads/master'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TRACKING_ISSUE: "70"
        run: |
          set -euo pipefail
          deployment=$(npx --yes wrangler@4.115.0 deployments status --env=staging --json)
          version_id=$(jq -er '
            .versions
            | map(select(.percentage == 100))
            | if length == 1 then .[0].version_id else empty end
          ' <<<"$deployment")
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          observed_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          body=$(cat <<EOF
          G1 staging deployment evidence

          - source CI run id: ${GITHUB_RUN_ID}
          - source CI run: ${run_url}
          - master SHA: ${GITHUB_SHA}
          - active staging Worker version: ${version_id}
          - traffic: 100%
          - observed at: ${observed_at}

          This breadcrumb records the deployment immediately after the workflow verified a single 100% active staging version. Deep-QA evidence for the same source CI run is recorded separately after the post-deploy suite succeeds.
          EOF
          )
          payload=$(jq -n --arg body "$body" '{body: $body}')
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${TRACKING_ISSUE}/comments" \
            --data "$payload" >/dev/null
