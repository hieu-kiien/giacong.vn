name: CI and Cloudflare staging gate

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/giacong-lean-commerce

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/giacong-lean-commerce/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm run audit:prod

      - name: Run application checks
        run: npm run check

  detail-baseline-sync:
    name: Sync detail runtime dependency baseline
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'security/production-dependency-audit'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout exact audit branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Remove shadcn from detail runtime dependency allowlist
        shell: python
        run: |
          from pathlib import Path
          path = Path("apps/giacong-lean-commerce/scripts/product-detail.test.mts")
          source = path.read_text()
          needle = '      "react-dom",\n      "shadcn",\n      "tailwind-merge",'
          replacement = '      "react-dom",\n      "tailwind-merge",'
          if needle not in source:
              if replacement in source:
                  print("detail runtime dependency baseline already normalized")
                  raise SystemExit(0)
              raise SystemExit("expected detail runtime dependency allowlist block was not found")
          path.write_text(source.replace(needle, replacement, 1))

      - name: Commit detail baseline update when needed
        shell: bash
        run: |
          set -euo pipefail
          file=apps/giacong-lean-commerce/scripts/product-detail.test.mts
          if git diff --quiet -- "$file"; then
            echo "detail runtime dependency baseline already normalized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$file"
          git commit -m "test: keep shadcn out of detail runtime allowlist"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  cloudflare-package:
    name: Cloudflare package gate
    if: github.event_name == 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/giacong-lean-commerce

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/giacong-lean-commerce/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build OpenNext for Cloudflare staging
        run: npm run cf:build:staging

      - name: Validate Wrangler package without deploying
        run: npx --yes wrangler@4.115.0 deploy --env=staging --dry-run --outdir=.wrangler-dry-run

  staging-deploy:
    name: Deploy Cloudflare staging
    if: github.event_name != 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/giacong-lean-commerce
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
      CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/giacong-lean-commerce/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify Cloudflare credentials and current staging worker
        run: npx --yes wrangler@4.115.0 deployments status --env=staging --json

      - name: Ensure staging Access Service Auth policy
        run: node scripts/ensure-staging-access-service-auth.mjs

      - name: Build OpenNext for Cloudflare staging
        run: npm run cf:build:staging

      - name: Validate Wrangler package before changing remote state
        run: npx --yes wrangler@4.115.0 deploy --env=staging --dry-run --outdir=.wrangler-dry-run

      - name: Apply pending D1 staging migrations
        run: npx --yes wrangler@4.115.0 d1 migrations apply GIACONG_VN_CATALOG --env=staging --remote

      - name: Deploy the validated OpenNext build to staging
        run: npx opennextjs-cloudflare deploy --env=staging

      - name: Verify active staging deployment
        shell: bash
        run: |
          set -euo pipefail
          deployment=$(npx --yes wrangler@4.115.0 deployments status --env=staging --json)
          echo "$deployment"
          jq -e '
            .versions | length == 1
            and .[0].percentage == 100
            and (. [0].version_id | type == "string" and length > 0)
          ' <<<"$deployment"
