name: Cloudflare admin D1 preflight

on:
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/cloudflare-admin-d1-preflight.yml"
      - "apps/giacong-lean-commerce/migrations/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-admin-d1-preflight-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit-staging-schema:
    name: Audit staging D1 admin readiness
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_NAME: giacong-vn-catalog-staging
      WRANGLER_VERSION: "4.115.0"

    steps:
      - name: Audit migration history and target table absence
        shell: bash
        run: |
          set -euo pipefail
          npx -y "wrangler@$WRANGLER_VERSION" d1 execute "$DATABASE_NAME" --remote --json --command="
            SELECT id, name, applied_at FROM d1_migrations ORDER BY id;
            SELECT name, sql
            FROM sqlite_master
            WHERE type = 'table' AND name = 'admin_audit_log';
          " | tee /tmp/migration-state.json

      - name: Audit mutable table concurrency columns
        shell: bash
        run: |
          set -euo pipefail
          for table in categories products product_variants services; do
            echo "===== $table ====="
            npx -y "wrangler@$WRANGLER_VERSION" d1 execute "$DATABASE_NAME" --remote --json \
              --command="PRAGMA table_info($table);"
          done | tee /tmp/table-info.txt

      - name: Audit keys indexes and foreign references
        shell: bash
        run: |
          set -euo pipefail
          npx -y "wrangler@$WRANGLER_VERSION" d1 execute "$DATABASE_NAME" --remote --json --command="
            SELECT type, name, tbl_name, sql
            FROM sqlite_master
            WHERE type IN ('index', 'trigger')
              AND tbl_name IN ('categories','products','product_variants','variant_tier_prices','services')
            ORDER BY tbl_name, type, name;
            PRAGMA foreign_key_list(products);
            PRAGMA foreign_key_list(product_variants);
            PRAGMA foreign_key_list(variant_tier_prices);
          " | tee /tmp/integrity-state.json

      - name: Audit business-row counts only
        shell: bash
        run: |
          set -euo pipefail
          npx -y "wrangler@$WRANGLER_VERSION" d1 execute "$DATABASE_NAME" --remote --json --command="
            SELECT 'categories' AS entity, COUNT(*) AS row_count FROM categories;
            SELECT 'products' AS entity, COUNT(*) AS row_count FROM products;
            SELECT 'product_variants' AS entity, COUNT(*) AS row_count FROM product_variants;
            SELECT 'variant_tier_prices' AS entity, COUNT(*) AS row_count FROM variant_tier_prices;
            SELECT 'services' AS entity, COUNT(*) AS row_count FROM services;
          " | tee /tmp/counts.json

      - name: Publish preflight summary
        shell: bash
        run: |
          {
            echo "## Staging D1 admin preflight"
            echo
            echo "Read-only audit completed against \`$DATABASE_NAME\`."
            echo
            echo "### Migration state"
            echo '```json'
            cat /tmp/migration-state.json
            echo '```'
            echo
            echo "### Business row counts"
            echo '```json'
            cat /tmp/counts.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
