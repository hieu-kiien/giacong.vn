name: Day 2 Cloudflare Browser Run diagnostic

on:
  push:
    branches: [feat/cloudflare-admin-category-api]
    paths:
      - .github/workflows/day2-cloudflare-browser-run-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
      CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Deploy temporary Browser Run worker
        shell: bash
        run: |
          set -euo pipefail
          WORKER="giacong-day2-browser-${GITHUB_RUN_ID}"
          trap 'npx --yes wrangler@4.36.0 delete --name "$WORKER" --force || true' EXIT
          mkdir -p /tmp/day2-browser
          cd /tmp/day2-browser
          npm init -y >/dev/null 2>&1
          npm install --no-save --no-package-lock @cloudflare/playwright@latest >/dev/null 2>&1
          cat > worker.js <<'EOF'
          import { launch } from "@cloudflare/playwright";
          export default {
            async fetch(request, env) {
              if (request.headers.get("x-day2-probe") !== env.DAY2_PROBE_SECRET) return new Response("not found", {status:404});
              const browser = await launch(env.BROWSER);
              try {
                const context = await browser.newContext({
                  extraHTTPHeaders: {
                    "CF-Access-Client-Id": env.CF_ACCESS_CLIENT_ID,
                    "CF-Access-Client-Secret": env.CF_ACCESS_CLIENT_SECRET,
                    "Accept": "application/json",
                  },
                });
                const page = await context.newPage();
                const response = await page.goto("https://admin-staging.kienhieu.id.vn/api/admin/variants/10", {waitUntil:"networkidle", timeout:30000});
                const body = (await page.locator("body").innerText()).slice(0,3000);
                const cookies = await context.cookies("https://admin-staging.kienhieu.id.vn");
                return Response.json({status: response?.status(), url: page.url(), title: await page.title(), body, cookieNames: cookies.map(c => c.name)});
              } finally { await browser.close(); }
            }
          };
          EOF
          cat > wrangler.jsonc <<EOF
          {"name":"$WORKER","main":"./worker.js","compatibility_date":"2026-08-16","workers_dev":true,"browser":{"binding":"BROWSER"}}
          EOF
          printf '%s' "$(openssl rand -hex 24)" > /tmp/day2-browser/probe-secret
          PROBE_SECRET="$(cat /tmp/day2-browser/probe-secret)"
          printf '%s' "$CLOUDFLARE_ACCESS_CLIENT_ID" | npx --yes wrangler@4.36.0 secret put CF_ACCESS_CLIENT_ID
          printf '%s' "$CLOUDFLARE_ACCESS_CLIENT_SECRET" | npx --yes wrangler@4.36.0 secret put CF_ACCESS_CLIENT_SECRET
          printf '%s' "$PROBE_SECRET" | npx --yes wrangler@4.36.0 secret put DAY2_PROBE_SECRET
          npx --yes wrangler@4.36.0 deploy --name "$WORKER" --config wrangler.jsonc
          curl -fsS -H "x-day2-probe: $PROBE_SECRET" "https://$WORKER.qtu1053.workers.dev/" | jq .
