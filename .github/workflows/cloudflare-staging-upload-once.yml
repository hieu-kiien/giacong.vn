name: Upload Cloudflare staging version once

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/cloudflare-staging-upload-once.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-staging-upload-once
  cancel-in-progress: false

jobs:
  upload-version:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/giacong-lean-commerce
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/giacong-lean-commerce/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Confirm current staging deployment
        run: wrangler deployments status --env=staging --json

      - name: Upload new OpenNext staging version without serving traffic
        run: npm run cf:upload:staging

      - name: List staging versions after upload
        run: wrangler versions list --env=staging --json

      - name: Confirm active deployment did not change
        run: wrangler deployments status --env=staging --json
