name: Upload Cloudflare staging version once

# Upload the Cloudflare-native staging Worker version after the master staging gate passes.
on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/cloudflare-staging-upload-once.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-staging-upload-once
  cancel-in-progress: false

jobs:
  upload-version:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/giacong-lean-commerce
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WRANGLER_VERSION: "4.131.1"
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/giacong-lean-commerce/package-lock.json

      - name: Verify staging R2 cache bucket access
        run: npx -y "wrangler@$WRANGLER_VERSION" r2 bucket info giacong-vn-next-cache-staging --json
      - name: Install dependencies
        run: npm ci

      - name: Confirm current staging deployment
        run: npx wrangler deployments status --env=staging --json

      - name: Apply guarded OpenNext R2 preflight workaround
        run: node scripts/patch-opennext-r2-preflight.mjs

      - name: Upload new OpenNext staging version without serving traffic
        run: npm run cf:upload:staging

      - name: List staging versions after upload
        run: npx wrangler versions list --env=staging --json

      - name: Confirm active deployment did not change
        run: npx wrangler deployments status --env=staging --json
