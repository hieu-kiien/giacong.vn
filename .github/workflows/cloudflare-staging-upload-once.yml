name: Upload Cloudflare staging version once

# Upload the Cloudflare-native staging Worker version after the master staging gate passes.
on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/cloudflare-staging-upload-once.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-staging-upload-once
  cancel-in-progress: false

jobs:
  upload-version:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/giacong-lean-commerce
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WRANGLER_VERSION: "4.131.1"
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/giacong-lean-commerce/package-lock.json

      - name: Verify staging R2 cache bucket access
        run: npx -y "wrangler@$WRANGLER_VERSION" r2 bucket info giacong-vn-next-cache-staging --json
      - name: Install dependencies
        run: npm ci

      - name: Confirm current staging deployment
        run: npx wrangler deployments status --env=staging --json

      - name: Upload new OpenNext staging version without serving traffic
        shell: bash
        run: |
          set -euo pipefail

          log_file="$RUNNER_TEMP/opennext-staging-upload.log"
          for attempt in 1 2 3; do
            set +e
            npm run cf:upload:staging 2>&1 | tee "$log_file"
            status=${PIPESTATUS[0]}
            set -e

            if [[ "$status" -eq 0 ]]; then
              exit 0
            fi

            # OpenNext reports this before it writes cache objects or uploads a Worker version.
            if [[ "$attempt" -eq 3 ]] || ! grep -Fq 'Failed to check whether bucket exists: Connection error.' "$log_file"; then
              exit "$status"
            fi

            delay=$((attempt * 30))
            echo "OpenNext could not reach the staging R2 bucket check; retrying in ${delay}s (attempt $((attempt + 1))/3)."
            sleep "$delay"
          done

      - name: List staging versions after upload
        run: npx wrangler versions list --env=staging --json

      - name: Confirm active deployment did not change
        run: npx wrangler deployments status --env=staging --json
