name: Audit Cloudflare staging infrastructure once

# Read-only audit; API sections degrade gracefully when the scoped token lacks a permission.
on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/cloudflare-infra-audit-once.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/giacong-lean-commerce
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ZONE_NAME: kienhieu.id.vn
      ADMIN_STAGING_HOST: admin-staging.kienhieu.id.vn
      ACTIVE_STAGING_ORIGIN: https://giacong-vn-staging.qtu1053.workers.dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/giacong-lean-commerce/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Resolve Cloudflare zone
        id: zone
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body --silent --show-error \
            "https://api.cloudflare.com/client/v4/zones?name=${ZONE_NAME}&status=active" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json")
          zone_id=$(jq -r '.result[0].id // empty' <<<"$response")
          if [ -z "$zone_id" ]; then
            echo "Could not resolve active zone ${ZONE_NAME}."
            jq '{success, errors, result_info}' <<<"$response"
            exit 1
          fi
          echo "zone_id=$zone_id" >> "$GITHUB_OUTPUT"
          echo "Zone resolved: ${ZONE_NAME}"

      - name: Inspect active staging Worker version and bindings
        shell: bash
        run: |
          set -euo pipefail
          deployment=$(npx wrangler deployments status --env=staging --json)
          version_id=$(jq -r '.versions[] | select(.percentage == 100) | .version_id' <<<"$deployment" | head -n 1)
          echo "Active staging version: ${version_id}"
          version=$(npx wrangler versions view "$version_id" --env=staging --json)
          jq '{id, number, bindings: [.resources.bindings[]? | {name, type, text: (if .name == "NEXT_PUBLIC_TURNSTILE_SITE_KEY" then "[public-site-key]" else .text end)}]}' <<<"$version"
          echo "Cloudflare data bindings:"
          jq '[.resources.bindings[]? | select(.type == "d1" or .type == "r2_bucket") | {name, type, id, database_id, database_name, bucket_name, jurisdiction}]' <<<"$version"

      - name: Inspect targeted staging DNS record when token permits
        shell: bash
        run: |
          set +e
          response=$(curl --silent --show-error --get \
            "https://api.cloudflare.com/client/v4/zones/${{ steps.zone.outputs.zone_id }}/dns_records" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --data-urlencode "name=${ADMIN_STAGING_HOST}" \
            --data-urlencode "per_page=100")
          success=$(jq -r '.success // false' <<<"$response" 2>/dev/null)
          if [ "$success" = "true" ]; then
            jq '{success, records: [.result[] | {type, name, content, proxied, ttl}]}' <<<"$response"
          else
            echo "DNS listing not available with this token; continuing."
            jq '{success, errors}' <<<"$response" 2>/dev/null || true
          fi
          exit 0

      - name: Inspect Worker routes when token permits
        shell: bash
        run: |
          set +e
          response=$(curl --silent --show-error \
            "https://api.cloudflare.com/client/v4/zones/${{ steps.zone.outputs.zone_id }}/workers/routes" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          success=$(jq -r '.success // false' <<<"$response" 2>/dev/null)
          if [ "$success" = "true" ]; then
            jq '{success, routes: [.result[] | {pattern, script}]}' <<<"$response"
          else
            echo "Workers Routes listing not available with this token; continuing."
            jq '{success, errors}' <<<"$response" 2>/dev/null || true
          fi
          exit 0

      - name: Inspect Cloudflare Tunnels when token permits
        shell: bash
        run: |
          set +e
          response=$(curl --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/cfd_tunnel?is_deleted=false&per_page=100" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          success=$(jq -r '.success // false' <<<"$response" 2>/dev/null)
          if [ "$success" = "true" ]; then
            jq '{success, tunnels: [.result[] | {id, name, status, remote_config}]}' <<<"$response"
          else
            echo "Tunnel listing not available with this token; continuing."
            jq '{success, errors}' <<<"$response" 2>/dev/null || true
          fi
          exit 0

      - name: Probe existing Bagisto staging hostname directly
        shell: bash
        run: |
          set +e
          for path in / /api/b2b/catalog/categories '/api/b2b/catalog/products?per_page=1'; do
            url="https://${ADMIN_STAGING_HOST}${path}"
            code=$(curl --silent --show-error --location --max-time 15 --output /tmp/probe-body --write-out '%{http_code}' "$url")
            content_type=$(curl --silent --show-error --head --max-time 15 "$url" | awk -F': ' 'tolower($1)=="content-type" {gsub("\r", "", $2); print $2; exit}')
            echo "direct $path -> HTTP ${code:-curl-error}; content-type=${content_type:-unknown}"
          done
          exit 0

      - name: Probe currently deployed staging Worker and identify catalog source hints
        shell: bash
        run: |
          set +e
          for path in / /san-pham /api/b2b/catalog/categories '/api/b2b/catalog/products?per_page=1'; do
            url="${ACTIVE_STAGING_ORIGIN}${path}"
            code=$(curl --silent --show-error --location --max-time 20 --output /tmp/worker-probe-body --write-out '%{http_code}' "$url")
            content_type=$(curl --silent --show-error --head --max-time 20 "$url" | awk -F': ' 'tolower($1)=="content-type" {gsub("\r", "", $2); print $2; exit}')
            echo "active-worker $path -> HTTP ${code:-curl-error}; content-type=${content_type:-unknown}"
            if [ "$path" = "/san-pham" ] && [ -s /tmp/worker-probe-body ]; then
              echo "Catalog source hints:"
              grep -Eio 'B2B-DEMO|dữ liệu demo|demo catalog|bột dinh dưỡng|hiển thị [0-9]+[^<]{0,30}sản phẩm' /tmp/worker-probe-body | head -n 20 || true
            fi
          done
          exit 0
