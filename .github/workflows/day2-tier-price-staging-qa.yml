name: Day 2 tier-price staging QA
on:
  push:
    branches: [feat/cloudflare-admin-category-api]
    paths:
      - .github/workflows/day2-tier-price-staging-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
      CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
      ADMIN_ORIGIN: https://admin-staging.kienhieu.id.vn
    steps:
      - uses: actions/checkout@v4
      - name: Add ephemeral CI IP exception and prove protected runtime
        shell: bash
        run: |
          set -euo pipefail
          zone_id="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/zones?name=kienhieu.id.vn&status=active" | jq -r '.result[0].id')"
          runner_ip="$(curl -fsS https://api.ipify.org)"
          echo "Runner public IP: $runner_ip"
          response="$(curl -fsS -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' "https://api.cloudflare.com/client/v4/zones/$zone_id/firewall/access_rules/rules" --data "$(jq -nc --arg ip "$runner_ip" '{configuration:{target:"ip",value:$ip},mode:"whitelist",notes:"Temporary GitHub Actions Day 2 staging QA; removed by workflow cleanup."}')")"
          echo "$response" | jq -e '.success == true and .result.id != null' >/dev/null
          rule_id="$(echo "$response" | jq -r '.result.id')"
          echo "Temporary rule created: $rule_id"
          cleanup() {
            curl -fsS -X DELETE -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/zones/$zone_id/firewall/access_rules/rules/$rule_id" >/tmp/delete-rule.json || true
            jq '{success,errors,result}' /tmp/delete-rule.json 2>/dev/null || true
          }
          trap cleanup EXIT

          status="$(curl --silent --show-error --max-time 25 \
            -H "CF-Access-Client-Id: $CLOUDFLARE_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CLOUDFLARE_ACCESS_CLIENT_SECRET" \
            -o /tmp/response.json -w '%{http_code}' \
            "$ADMIN_ORIGIN/api/admin/variants/10")"
          echo "Protected GET HTTP status after temporary bot-protection exception: $status"
          cat /tmp/response.json
          test "$status" = 200
          jq -e '.ok == true and .data.id == 10 and (.data.version | startswith("r1_")) and (.data.tierPrices | length >= 1)' /tmp/response.json >/dev/null
