name: Day 2 tier-price staging QA
on:
  push:
    branches: [feat/cloudflare-admin-category-api]
    paths:
      - .github/workflows/day2-tier-price-staging-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
      CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
      ADMIN_ORIGIN: https://admin-staging.kienhieu.id.vn
    steps:
      - uses: actions/checkout@v4
      - name: Inspect zone challenge controls
        shell: bash
        run: |
          set -euo pipefail
          zone_id="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/zones?name=kienhieu.id.vn&status=active" | jq -r '.result[0].id')"
          for setting in security_level browser_check challenge_ttl; do
            echo "--- $setting ---"
            curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/zones/$zone_id/settings/$setting" | jq '{success,errors,result}' || true
          done
          echo '--- bot fight mode ---'
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/zones/$zone_id/settings/bot_fight_mode" | jq '{success,errors,result}' || true
          echo '--- bot management ---'
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/zones/$zone_id/bot_management" | jq '{success,errors,result}' || true
      - name: Confirm edge behavior
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --max-time 25 -H "CF-Access-Client-Id: $CLOUDFLARE_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CLOUDFLARE_ACCESS_CLIENT_SECRET" -o /tmp/response.json -w '%{http_code}' "$ADMIN_ORIGIN/api/admin/variants/10")"
          echo "HTTP_STATUS=$status"
          head -c 300 /tmp/response.json || true
          echo
