name: Day 2 Cloudflare internal proxy diagnostic

on:
  push:
    branches: [feat/cloudflare-admin-category-api]
    paths:
      - .github/workflows/day2-cloudflare-internal-proxy-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
      CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Deploy temporary Cloudflare internal proxy
        shell: bash
        run: |
          set -euo pipefail
          WORKER="giacong-day2-probe-${GITHUB_RUN_ID}"
          trap 'npx --yes wrangler@4.36.0 delete --name "$WORKER" --force || true' EXIT
          mkdir -p /tmp/day2-probe
          cat > /tmp/day2-probe/worker.js <<'EOF'
          export default {
            async fetch(request, env) {
              if (request.headers.get("x-day2-probe") !== env.DAY2_PROBE_SECRET) {
                return new Response("not found", { status: 404 });
              }
              const target = new Request("https://admin-staging.kienhieu.id.vn/api/admin/variants/10", {
                method: "GET",
                headers: {
                  "CF-Access-Client-Id": env.CF_ACCESS_CLIENT_ID,
                  "CF-Access-Client-Secret": env.CF_ACCESS_CLIENT_SECRET,
                  "Accept": "application/json",
                },
              });
              const response = await fetch(target);
              const text = await response.text();
              return new Response(JSON.stringify({status: response.status, body: text.slice(0,1500)}), {headers:{"content-type":"application/json"}});
            }
          };
          EOF
          cat > /tmp/day2-probe/wrangler.jsonc <<EOF
          {"name":"$WORKER","main":"./worker.js","compatibility_date":"2026-08-16","workers_dev":true}
          EOF
          printf '%s' "$CLOUDFLARE_ACCESS_CLIENT_ID" | npx --yes wrangler@4.36.0 secret put CF_ACCESS_CLIENT_ID --config /tmp/day2-probe/wrangler.jsonc
          printf '%s' "$CLOUDFLARE_ACCESS_CLIENT_SECRET" | npx --yes wrangler@4.36.0 secret put CF_ACCESS_CLIENT_SECRET --config /tmp/day2-probe/wrangler.jsonc
          probe_secret="$(openssl rand -hex 24)"
          printf '%s' "$probe_secret" | npx --yes wrangler@4.36.0 secret put DAY2_PROBE_SECRET --config /tmp/day2-probe/wrangler.jsonc
          npx --yes wrangler@4.36.0 deploy --config /tmp/day2-probe/wrangler.jsonc
          subdomain="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain")"
          workers_subdomain="$(echo "$subdomain" | jq -r '.result.subdomain // empty')"
          test -n "$workers_subdomain"
          curl -fsS -H "x-day2-probe: $probe_secret" "https://$WORKER.$workers_subdomain.workers.dev/" | jq .
