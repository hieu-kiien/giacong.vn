name: Cloudflare staging deep QA

on:
  workflow_run:
    workflows:
      - CI and Cloudflare staging gate
    types:
      - completed
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-staging-deep-qa
  cancel-in-progress: false

jobs:
  qa:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    defaults:
      run:
        working-directory: apps/giacong-lean-commerce
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
      CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
      STAGING_EDGE_ORIGIN: ${{ vars.STAGING_ORIGIN || 'https://staging.kienhieu.id.vn' }}
      STAGING_ORIGIN: ${{ vars.STAGING_ORIGIN || 'https://staging.kienhieu.id.vn' }}
      STAGING_DATABASE: giacong-vn-catalog-staging
      STAGING_WORKER_NAME: giacong-vn-staging

    steps:
      - name: Checkout deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/giacong-lean-commerce/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify custom staging edge boundary
        run: node scripts/staging-edge-protection-qa.mjs

      - name: Open temporary free-tier direct Worker QA route
        run: node scripts/manage-staging-direct-qa.mjs open

      - name: Verify baseline security headers
        run: node scripts/staging-security-qa.mjs

      - name: Install Chromium for responsive QA
        run: npx playwright install --with-deps chromium

      - name: Verify accessibility semantics and keyboard focus
        run: node scripts/staging-accessibility-qa.mjs

      - name: Verify performance lab anti-regression budgets
        run: node scripts/staging-performance-qa.mjs

      - name: Run staging deep QA through guarded direct route
        run: node scripts/staging-deep-qa.mjs

      - name: Run News staging regression QA
        run: node scripts/staging-news-qa.mjs

      - name: Restore persistent workers.dev state
        if: always()
        run: node scripts/manage-staging-direct-qa.mjs restore

      - name: Record successful master staging QA evidence
        if: success() && github.event_name == 'workflow_run'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TRACKING_ISSUE: "70"
          SOURCE_CI_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          qa_run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          source_run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_CI_RUN_ID}"
          observed_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          body=$(cat <<EOF
          G1 staging deep-QA evidence

          - source CI run id: ${SOURCE_CI_RUN_ID}
          - source CI run: ${source_run_url}
          - deployed source SHA: ${SOURCE_SHA}
          - deep-QA run: ${qa_run_url}
          - observed at: ${observed_at}
          - custom staging edge boundary: PASS
          - temporary guarded workers.dev application QA: PASS and restored
          - baseline application security headers: PASS
          - accessibility semantics/keyboard focus: PASS
          - performance lab anti-regression budgets: PASS
          - staging public/runtime deep QA: PASS
          - News staging regression QA: PASS

          Match this comment to the deployment breadcrumb with the same source CI run id. The custom hostname keeps its Cloudflare Free security boundary, while application QA uses the same deployed staging Worker through a temporary read-mostly workers.dev route that is restored before this evidence is recorded.
          EOF
          )
          payload=$(jq -n --arg body "$body" '{body: $body}')
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${TRACKING_ISSUE}/comments" \
            --data "$payload" >/dev/null

      - name: Record failed master staging QA evidence
        if: failure() && github.event_name == 'workflow_run'
        shell: bash
        working-directory: .
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TRACKING_ISSUE: "70"
          SOURCE_CI_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          qa_run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          source_run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_CI_RUN_ID}"
          observed_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          body=$(cat <<EOF
          G1 staging deep-QA failure evidence

          - source CI run id: ${SOURCE_CI_RUN_ID}
          - source CI run: ${source_run_url}
          - deployed source SHA: ${SOURCE_SHA}
          - deep-QA run: ${qa_run_url}
          - observed at: ${observed_at}

          The post-deploy QA workflow did not complete successfully. The workflow attempted to restore the temporary direct workers.dev state before recording this failure. G1 remains OPEN; this breadcrumb is not acceptance evidence and does not authorize production mutation.
          EOF
          )
          payload=$(jq -n --arg body "$body" '{body: $body}')
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${TRACKING_ISSUE}/comments" \
            --data "$payload" >/dev/null
