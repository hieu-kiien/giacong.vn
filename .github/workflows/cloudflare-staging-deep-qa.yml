name: Cloudflare staging deep QA

on:
  workflow_run:
    workflows:
      - CI and Cloudflare staging gate
    types:
      - completed
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-staging-deep-qa
  cancel-in-progress: false

jobs:
  qa:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/giacong-lean-commerce
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
      CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
      STAGING_ORIGIN: ${{ vars.STAGING_ORIGIN || 'https://staging.kienhieu.id.vn' }}
      STAGING_DATABASE: giacong-vn-catalog-staging

    steps:
      - name: Checkout deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/giacong-lean-commerce/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify baseline security headers
        run: node scripts/staging-security-qa.mjs

      - name: Install Chromium for responsive QA
        run: npx playwright install --with-deps chromium

      - name: Verify accessibility semantics and keyboard focus
        run: node scripts/staging-accessibility-qa.mjs

      - name: Verify performance lab anti-regression budgets
        run: node scripts/staging-performance-qa.mjs

      - name: Run Access-authenticated staging deep QA
        run: node scripts/staging-deep-qa.mjs

      - name: Run News staging regression QA
        run: node scripts/staging-news-qa.mjs
