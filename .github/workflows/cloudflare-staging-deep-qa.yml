name: Cloudflare staging deep QA

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/cloudflare-staging-deep-qa.yml
      - apps/giacong-lean-commerce/src/**
      - apps/giacong-lean-commerce/scripts/qa-staging-catalog.mjs
      - apps/giacong-lean-commerce/scripts/qa-deep-staging-contract.test.mjs
      - apps/giacong-lean-commerce/wrangler.jsonc
      - apps/giacong-lean-commerce/package.json
      - apps/giacong-lean-commerce/package-lock.json
  workflow_dispatch:
    inputs:
      preview_version_id:
        description: "Optional uploaded staging version ID; tests its isolated preview without promoting it."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: cloudflare-staging-deep-qa
  cancel-in-progress: false

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/giacong-lean-commerce
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
      CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
      PREVIEW_VERSION_ID: ${{ inputs.preview_version_id }}
      # The public hostname remains a separate smoke target. The active
      # version's isolated preview is selected after Wrangler verifies traffic
      # and is used for authenticated CI requests below.
      STAGING_ORIGIN: https://staging.kienhieu.id.vn
      STAGING_PUBLIC_ORIGIN: https://staging.kienhieu.id.vn
      STAGING_DATABASE: giacong-vn-catalog-staging
      STAGING_WORKER_NAME: giacong-vn-staging
      STAGING_WORKERS_SUBDOMAIN: qtu1053
      # Set to true after the active version's protected preview is selected.
      STAGING_ACCESS_REQUIRED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/giacong-lean-commerce/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Select active staging version or isolated preview
        shell: bash
        run: |
          set -euo pipefail
          deployment=$(npx wrangler deployments status --env=staging --json)
          echo "$deployment"
          jq -e '
            .versions | length == 1
            and .[0].percentage == 100
            and (. [0].version_id | type == "string" and length > 0)
          ' <<<"$deployment"
          active_version_id="$(echo "$deployment" | jq -r '.versions[0].version_id')"
          selected_version_id="$active_version_id"
          if [[ -n "${PREVIEW_VERSION_ID:-}" ]]; then
            selected_version_id="$PREVIEW_VERSION_ID"
            npx wrangler versions view "$selected_version_id" --env=staging --json > /tmp/selected-version.json
            jq -e --arg id "$selected_version_id" '.id == $id' /tmp/selected-version.json
            echo "Selected isolated preview version; staging traffic remains on $active_version_id"
          else
            echo "Selected active staging version $active_version_id"
          fi
          preview_prefix="${selected_version_id%%-*}"
          preview_origin="https://${preview_prefix}-${STAGING_WORKER_NAME}.${STAGING_WORKERS_SUBDOMAIN}.workers.dev"
          echo "STAGING_ORIGIN=$preview_origin" >> "$GITHUB_ENV"
          echo "STAGING_ACCESS_REQUIRED=true" >> "$GITHUB_ENV"
          echo "CI origin: $preview_origin"

      - name: Prepare read-only catalog QA state
        shell: bash
        run: |
          set -euo pipefail

          npx wrangler d1 execute "$STAGING_DATABASE" --remote --json \
            --command="SELECT COUNT(*) AS active_count FROM products WHERE is_active = 1;" \
            > /tmp/staging-active-count.json
          active_count=$(jq -r '.[0].results[0].active_count // empty' /tmp/staging-active-count.json)
          [[ "$active_count" =~ ^[0-9]+$ ]]
          echo "STAGING_ACTIVE_PRODUCT_COUNT=$active_count" >> "$GITHUB_ENV"

          if (( active_count > 0 )); then
            npx wrangler d1 execute "$STAGING_DATABASE" --remote --json \
              --command="SELECT p.slug, p.name, c.slug AS category_slug FROM products p LEFT JOIN categories c ON c.id = p.category_id WHERE p.is_active = 1 ORDER BY p.slug LIMIT 1;" \
              > /tmp/staging-active-product.json
            active_slug=$(jq -r '.[0].results[0].slug // empty' /tmp/staging-active-product.json)
            test -n "$active_slug"
          else
            printf '{}' > /tmp/staging-active-product.json
            active_slug=""
          fi
          echo "STAGING_ACTIVE_PRODUCT_SLUG=$active_slug" >> "$GITHUB_ENV"

          npx wrangler d1 execute "$STAGING_DATABASE" --remote --json \
            --command="SELECT slug, name FROM products WHERE is_active = 0 ORDER BY slug LIMIT 1;" \
            > /tmp/staging-inactive-product.json
          inactive_slug=$(jq -r '.[0].results[0].slug // empty' /tmp/staging-inactive-product.json)
          echo "STAGING_INACTIVE_PRODUCT_SLUG=$inactive_slug" >> "$GITHUB_ENV"
          echo "Public catalog active product count: $active_count"

      - name: Verify catalog and dynamic product/cart/contact guards
        shell: bash
        run: node scripts/qa-staging-catalog.mjs

      - name: Verify R2 media response
        shell: bash
        run: |
          set -euo pipefail

          staging_curl() {
            local -a access_headers=()
            if [[ "${STAGING_ACCESS_REQUIRED:-false}" == "true" && -n "${CLOUDFLARE_ACCESS_CLIENT_ID:-}" && -n "${CLOUDFLARE_ACCESS_CLIENT_SECRET:-}" ]]; then
              access_headers=(
                -H "CF-Access-Client-Id: ${CLOUDFLARE_ACCESS_CLIENT_ID}"
                -H "CF-Access-Client-Secret: ${CLOUDFLARE_ACCESS_CLIENT_SECRET}"
              )
            fi
            command curl --user-agent 'Giacong-Staging-Deep-QA/1.0' "${access_headers[@]}" "$@"
          }

          staging_curl --fail-with-body --silent --show-error --location --max-time 25 \
            --dump-header /tmp/media.headers \
            --output /tmp/media.bin \
            "$STAGING_ORIGIN/media/products/c5be4fe1-3daa-40ad-b9df-54717ec5c863.jpg"
          test "$(wc -c < /tmp/media.bin)" -gt 100000
          grep -Eiq '^content-type: image/(jpeg|jpg)' /tmp/media.headers

      - name: Install Chromium for responsive QA
        run: npx playwright install --with-deps chromium

      - name: Verify responsive layout and browser errors
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';

          const origin = process.env.STAGING_ORIGIN;
          const routes = [
            '/',
            '/san-pham',
            '/gui-yeu-cau',
            '/thue-gia-cong/say-thuc-pham-say',
          ];
          if (process.env.STAGING_ACTIVE_PRODUCT_SLUG) {
            routes.push(`/san-pham/${encodeURIComponent(process.env.STAGING_ACTIVE_PRODUCT_SLUG)}`);
          }
          const viewports = [
            { name: 'mobile', width: 390, height: 844 },
            { name: 'tablet', width: 768, height: 1024 },
            { name: 'desktop', width: 1440, height: 900 },
            { name: 'laptop-16x9', width: 1366, height: 768 },
            { name: 'full-hd-16x9', width: 1920, height: 1080 },
          ];

          const browser = await chromium.launch({ headless: true });
          const stagingOrigin = new URL(origin).origin;
          const accessHeaders = process.env.STAGING_ACCESS_REQUIRED === 'true'
            && process.env.CLOUDFLARE_ACCESS_CLIENT_ID
            && process.env.CLOUDFLARE_ACCESS_CLIENT_SECRET
            ? {
                'CF-Access-Client-Id': process.env.CLOUDFLARE_ACCESS_CLIENT_ID,
                'CF-Access-Client-Secret': process.env.CLOUDFLARE_ACCESS_CLIENT_SECRET,
              }
            : {};
          try {
            for (const viewport of viewports) {
              const context = await browser.newContext({ viewport });
              await context.route('**/*', async (route) => {
                const requestUrl = new URL(route.request().url());
                if (requestUrl.origin !== stagingOrigin || Object.keys(accessHeaders).length === 0) {
                  await route.continue();
                  return;
                }
                await route.continue({ headers: { ...route.request().headers(), ...accessHeaders } });
              });
              for (const route of routes) {
                const page = await context.newPage();
                const errors = [];
                page.on('pageerror', (error) => errors.push(`pageerror: ${error.message}`));
                page.on('console', (message) => {
                  if (message.type() === 'error') errors.push(`console: ${message.text()}`);
                });
                const response = await page.goto(`${origin}${route}`, { waitUntil: 'networkidle', timeout: 30000 });
                if (!response || response.status() >= 400) {
                  throw new Error(`${viewport.name} ${route}: HTTP ${response?.status() ?? 'no response'}`);
                }
                const dimensions = await page.evaluate(() => ({
                  clientWidth: document.documentElement.clientWidth,
                  scrollWidth: document.documentElement.scrollWidth,
                }));
                if (dimensions.scrollWidth > dimensions.clientWidth + 1) {
                  throw new Error(`${viewport.name} ${route}: horizontal overflow ${dimensions.scrollWidth} > ${dimensions.clientWidth}`);
                }
                if (errors.length) {
                  throw new Error(`${viewport.name} ${route}: ${errors.join(' | ')}`);
                }
                console.log(`${viewport.name} ${route}: HTTP ${response.status()}, width ${dimensions.clientWidth}/${dimensions.scrollWidth}`);
                await page.close();
              }
              await context.close();
            }
          } finally {
            await browser.close();
          }
          JS
