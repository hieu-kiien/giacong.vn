<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>giacong.vn - Trình duyệt Dữ liệu Offline</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Lexend:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #5aa400;
            --primary-light: #e8f5e9;
            --secondary: #eb892d;
            --secondary-light: #fff3e0;
            --dark: #2c3e50;
            --text: #2f3542;
            --text-light: #747d8c;
            --bg: #f1f2f6;
            --card: #ffffff;
            --border: #dfe4ea;
            --sidebar-width: 360px;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* Sidebar Styling */
        .sidebar {
            width: var(--sidebar-width);
            background-color: var(--card);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            height: 100%;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 24px;
            border-bottom: 1px solid var(--border);
        }

        .logo {
            font-family: 'Lexend', sans-serif;
            font-weight: 800;
            font-size: 24px;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            margin-bottom: 16px;
        }

        .logo span {
            color: var(--secondary);
        }

        .search-box {
            position: relative;
            margin-bottom: 12px;
        }

        .search-input {
            width: 100%;
            padding: 12px 16px 12px 40px;
            border: 1px solid var(--border);
            border-radius: 12px;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: all 0.2s;
            background-color: #f8f9fa;
        }

        .search-input:focus {
            border-color: var(--primary);
            background-color: var(--card);
            box-shadow: 0 0 0 3px rgba(90, 164, 0, 0.15);
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light);
            pointer-events: none;
        }

        /* Filter Tabs */
        .tabs {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 4px;
            scrollbar-width: none; /* Firefox */
        }
        .tabs::-webkit-scrollbar {
            display: none; /* Safari & Chrome */
        }

        .tab {
            padding: 8px 14px;
            background-color: #f1f2f6;
            border: none;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            font-family: inherit;
            color: var(--text-light);
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .tab.active {
            background-color: var(--primary);
            color: white;
        }

        .tab:hover:not(.active) {
            background-color: #e4e7eb;
            color: var(--text);
        }

        /* Page List */
        .page-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }

        .page-item {
            padding: 14px 16px;
            border-radius: 10px;
            cursor: pointer;
            margin-bottom: 6px;
            transition: all 0.2s;
            border: 1px solid transparent;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .page-item:hover {
            background-color: #f8f9fa;
            border-color: var(--border);
        }

        .page-item.active {
            background-color: var(--primary-light);
            border-color: rgba(90, 164, 0, 0.3);
        }

        .page-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--dark);
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .page-item.active .page-title {
            color: var(--primary);
        }

        .page-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .badge {
            font-size: 10px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .badge-home { background-color: #e8f4fd; color: #1e88e5; }
        .badge-product { background-color: var(--secondary-light); color: var(--secondary); }
        .badge-service { background-color: var(--primary-light); color: var(--primary); }
        .badge-contact { background-color: #f3e5f5; color: #8e24aa; }
        .badge-other { background-color: #eceff1; color: #607d8b; }

        .page-url {
            font-size: 11px;
            color: var(--text-light);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 180px;
        }

        /* Main Viewport Styling (Browser Simulator) */
        .main-viewport {
            flex: 1;
            padding: 24px;
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
        }

        .browser-window {
            background-color: var(--card);
            border-radius: 16px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-lg);
            display: flex;
            flex-direction: column;
            flex: 1;
            overflow: hidden;
        }

        /* Browser Header */
        .browser-header {
            background-color: #f8f9fa;
            border-bottom: 1px solid var(--border);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-shrink: 0;
        }

        .browser-dots {
            display: flex;
            gap: 6px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        .dot-red { background-color: #ff5f56; }
        .dot-yellow { background-color: #ffbd2e; }
        .dot-green { background-color: #27c93f; }

        .browser-address-bar {
            flex: 1;
            background-color: #ffffff;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 16px;
            font-size: 13px;
            color: var(--text-light);
            display: flex;
            align-items: center;
            gap: 8px;
            overflow: hidden;
        }

        .browser-address-bar svg {
            color: #27c93f;
            flex-shrink: 0;
        }

        .browser-url-text {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-family: monospace;
        }

        /* Browser Content Viewport */
        .browser-content {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        /* Mock Website Header */
        .mock-header {
            background-color: var(--primary);
            color: white;
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            border-bottom: 4px solid var(--secondary);
        }

        .mock-logo {
            font-family: 'Lexend', sans-serif;
            font-weight: 800;
            font-size: 20px;
            color: white;
        }
        .mock-logo span {
            color: #ffffff;
            opacity: 0.8;
            font-weight: 400;
        }

        .mock-menu {
            display: flex;
            gap: 20px;
            font-size: 14px;
            font-weight: 500;
        }
        .mock-menu-item {
            cursor: pointer;
            opacity: 0.9;
            transition: opacity 0.2s;
        }
        .mock-menu-item:hover {
            opacity: 1;
            text-decoration: underline;
        }

        .mock-hotline {
            background-color: var(--secondary);
            padding: 8px 16px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Mock Website Body */
        .mock-body {
            padding: 40px 60px;
            max-width: 1000px;
            width: 100%;
            margin: 0 auto;
            flex: 1;
        }

        .breadcrumbs {
            font-size: 13px;
            color: var(--text-light);
            margin-bottom: 24px;
        }

        .post-title-h1 {
            font-family: 'Lexend', sans-serif;
            font-size: 32px;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 12px;
            line-height: 1.3;
        }

        .post-category-tag {
            display: inline-block;
            margin-bottom: 30px;
        }

        .post-content-container {
            font-size: 16px;
            line-height: 1.8;
            color: var(--text);
            margin-bottom: 40px;
        }

        .post-content-container p {
            margin-bottom: 18px;
            white-space: pre-wrap;
        }

        /* Contacts Panel */
        .contacts-panel {
            background: linear-gradient(135deg, #f9fbf7 0%, #f4f8f0 100%);
            border: 1px dashed rgba(90, 164, 0, 0.4);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 40px;
        }

        .panel-title {
            font-family: 'Lexend', sans-serif;
            font-weight: 600;
            font-size: 18px;
            color: var(--primary);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .contact-row {
            display: flex;
            gap: 12px;
            margin-bottom: 10px;
            font-size: 14px;
        }
        .contact-row:last-child {
            margin-bottom: 0;
        }
        .contact-label {
            font-weight: 600;
            width: 90px;
            color: var(--dark);
        }
        .contact-value {
            color: var(--text);
        }

        /* Image Gallery */
        .gallery-section {
            margin-top: 30px;
        }
        .gallery-title {
            font-family: 'Lexend', sans-serif;
            font-size: 20px;
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 16px;
        }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
        }
        .gallery-item {
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border);
            aspect-ratio: 4/3;
            background-color: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .gallery-item:hover {
            transform: scale(1.03);
        }
        .gallery-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: cover;
            width: 100%;
            height: 100%;
        }

        /* Empty State */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            padding: 40px;
            text-align: center;
            color: var(--text-light);
        }
        .empty-state svg {
            margin-bottom: 16px;
            color: var(--border);
        }
        .empty-state-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 8px;
        }

        /* File Upload Area (Fallback) */
        .upload-container {
            background-color: var(--card);
            border: 2px dashed var(--border);
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            max-width: 500px;
            width: 100%;
            margin: 40px auto;
            display: none;
        }
        .upload-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 16px;
            transition: background-color 0.2s;
        }
        .upload-btn:hover {
            background-color: #4c8a00;
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-header">
            <a href="#" class="logo">giacong<span>.vn</span></a>
            <div class="search-box">
                <span class="search-icon">
                    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                </span>
                <input type="text" id="searchInput" class="search-input" placeholder="Tìm kiếm trang đã cào...">
            </div>
            <div class="tabs">
                <button class="tab active" onclick="filterCategory('all')">Tất cả</button>
                <button class="tab" onclick="filterCategory('trang chủ')">Trang chủ</button>
                <button class="tab" onclick="filterCategory('sản phẩm')">Sản phẩm</button>
                <button class="tab" onclick="filterCategory('dịch vụ')">Dịch vụ</button>
                <button class="tab" onclick="filterCategory('liên hệ')">Liên hệ</button>
                <button class="tab" onclick="filterCategory('khác')">Khác</button>
            </div>
        </div>
        <div class="page-list" id="pageList">
            <!-- Dynamic page items go here -->
        </div>
    </div>

    <!-- Main Viewport -->
    <div class="main-viewport">
        <!-- CORS File Loader Fallback -->
        <div class="upload-container" id="uploadContainer">
            <h3 style="margin-bottom: 12px; font-family: 'Lexend', sans-serif;">Tải file dữ liệu cào</h3>
            <p style="font-size: 14px; color: var(--text-light);">Do bảo mật trình duyệt khi mở trực tiếp file HTML, vui lòng chọn file <strong>crawled_data.json</strong> từ máy của bạn để bắt đầu.</p>
            <input type="file" id="fileInput" accept=".json" style="display: none;">
            <button class="upload-btn" onclick="document.getElementById('fileInput').click()">Chọn file crawled_data.json</button>
        </div>

        <!-- Simulated Browser -->
        <div class="browser-window" id="browserWindow">
            <div class="browser-header">
                <div class="browser-dots">
                    <div class="dot dot-red"></div>
                    <div class="dot dot-yellow"></div>
                    <div class="dot dot-green"></div>
                </div>
                <div class="browser-address-bar">
                    <svg width="14" height="14" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
                    <div class="browser-url-text" id="browserUrl">https://giacong.vn/</div>
                </div>
            </div>
            <div class="browser-content" id="browserContent">
                <div class="empty-state">
                    <svg width="64" height="64" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" viewBox="0 0 24 24"><path d="M21 12V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-6z"></path><path d="M3 16l5-5 5 5 5-5 3 3"></path><circle cx="14" cy="8" r="1"></circle></svg>
                    <div class="empty-state-title">Vui lòng chọn một trang bên cột trái</div>
                    <p>Chọn một trang dịch vụ hoặc sản phẩm để mô phỏng hiển thị dữ liệu đã cào được.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let allPages = [];
        let currentFilter = 'all';
        let currentSearch = '';

        // Attempt to fetch json from local server
        window.addEventListener('DOMContentLoaded', () => {
            fetch('crawled_data.json')
                .then(res => {
                    if (!res.ok) throw new Error("CORS or File Not Found");
                    return res.json();
                })
                .then(data => {
                    allPages = data;
                    initExplorer();
                })
                .catch(err => {
                    console.log("Could not load crawled_data.json via fetch, showing fallback file loader.");
                    document.getElementById('browserWindow').style.display = 'none';
                    document.getElementById('uploadContainer').style.display = 'block';
                });
        });

        // Fallback File input handler
        document.getElementById('fileInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    allPages = JSON.parse(evt.target.result);
                    document.getElementById('uploadContainer').style.display = 'none';
                    document.getElementById('browserWindow').style.display = 'flex';
                    initExplorer();
                } catch(ex) {
                    alert("File không đúng định dạng JSON!");
                }
            };
            reader.readAsText(file);
        });

        // Search Input handler
        document.getElementById('searchInput').addEventListener('input', (e) => {
            currentSearch = e.target.value.toLowerCase();
            renderPageList();
        });

        function initExplorer() {
            renderPageList();
            if (allPages.length > 0) {
                // Auto-select homepage or first page
                const home = allPages.find(p => p.category === 'trang chủ') || allPages[0];
                selectPage(home.url);
            }
        }

        function filterCategory(cat) {
            currentFilter = cat;
            
            // Set active class on tabs
            const tabs = document.querySelectorAll('.tab');
            tabs.forEach(tab => {
                if (tab.textContent.toLowerCase() === cat) {
                    tab.classList.add('active');
                } else if (cat === 'all' && tab.textContent === 'Tất cả') {
                    tab.classList.add('active');
                } else {
                    tab.classList.remove('active');
                }
            });

            renderPageList();
        }

        function getCategoryBadgeClass(cat) {
            switch(cat) {
                case 'trang chủ': return 'badge-home';
                case 'sản phẩm': return 'badge-product';
                case 'dịch vụ': return 'badge-service';
                case 'liên hệ': return 'badge-contact';
                default: return 'badge-other';
            }
        }

        function renderPageList() {
            const listEl = document.getElementById('pageList');
            listEl.innerHTML = '';

            const filtered = allPages.filter(p => {
                const matchesCategory = currentFilter === 'all' || p.category === currentFilter;
                const matchesSearch = p.title.toLowerCase().includes(currentSearch) || 
                                      p.url.toLowerCase().includes(currentSearch) || 
                                      (p.content && p.content.toLowerCase().includes(currentSearch));
                return matchesCategory && matchesSearch;
            });

            filtered.forEach(p => {
                const item = document.createElement('div');
                const isActive = document.getElementById('browserUrl').textContent === p.url;
                item.className = `page-item ${isActive ? 'active' : ''}`;
                item.setAttribute('onclick', `selectPage('${p.url}')`);
                item.id = `item-${btoa(p.url).replace(/=/g, '')}`;

                item.innerHTML = `
                    <div class="page-title">${p.title}</div>
                    <div class="page-meta">
                        <span class="badge ${getCategoryBadgeClass(p.category)}">${p.category}</span>
                        <span class="page-url" title="${p.url}">${p.url.replace('https://giacong.vn', '')}</span>
                    </div>
                `;
                listEl.appendChild(item);
            });

            if (filtered.length === 0) {
                listEl.innerHTML = '<div style="padding: 24px; text-align: center; color: var(--text-light); font-size: 14px;">Không tìm thấy trang nào.</div>';
            }
        }

        function selectPage(url) {
            const page = allPages.find(p => p.url === url);
            if (!page) return;

            // Set address bar
            document.getElementById('browserUrl').textContent = page.url;

            // Update active states in sidebar list
            const activeItems = document.querySelectorAll('.page-item');
            activeItems.forEach(i => i.classList.remove('active'));
            
            const activeItem = document.getElementById(`item-${btoa(url).replace(/=/g, '')}`);
            if (activeItem) activeItem.classList.add('active');

            // Render mock browser view
            const contentEl = document.getElementById('browserContent');
            
            // Format content paragraphs
            let contentHtml = '';
            if (page.content) {
                const paragraphs = page.content.split('\n\n');
                paragraphs.forEach(p => {
                    if (p.trim()) {
                        contentHtml += `<p>${p.trim()}</p>`;
                    }
                });
            } else {
                contentHtml = '<p style="color: var(--text-light); font-style: italic;">Không có nội dung văn bản chính được phát hiện.</p>';
            }

            // Format contacts
            let contactsHtml = '';
            if (page.contacts && (page.contacts.phone?.length || page.contacts.email?.length || page.contacts.address?.length)) {
                contactsHtml = `
                    <div class="contacts-panel">
                        <div class="panel-title">
                            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
                            Thông tin liên hệ trích xuất được
                        </div>
                `;
                if (page.contacts.phone?.length) {
                    contactsHtml += `
                        <div class="contact-row">
                            <span class="contact-label">Hotline:</span>
                            <span class="contact-value">${page.contacts.phone.join(', ')}</span>
                        </div>
                    `;
                }
                if (page.contacts.email?.length) {
                    contactsHtml += `
                        <div class="contact-row">
                            <span class="contact-label">Email:</span>
                            <span class="contact-value">${page.contacts.email.join(', ')}</span>
                        </div>
                    `;
                }
                if (page.contacts.address?.length) {
                    const cleanAddrs = page.contacts.address.filter(a => !a.includes("Tên tài khoản"));
                    if (cleanAddrs.length > 0) {
                        contactsHtml += `
                            <div class="contact-row">
                                <span class="contact-label">Địa chỉ:</span>
                                <span class="contact-value">${cleanAddrs.join('; ')}</span>
                            </div>
                        `;
                    }
                }
                contactsHtml += `</div>`;
            }

            // Format Image Gallery
            let galleryHtml = '';
            if (page.images && page.images.length > 0) {
                // Filter out relative duplicates or SVGs if desired
                const uniqueImages = [...new Set(page.images)].map(img => {
                    if (img.startsWith('/')) return 'https://giacong.vn' + img;
                    return img;
                }).filter(img => img.startsWith('http') && !img.includes('dmca'));

                if (uniqueImages.length > 0) {
                    galleryHtml = `
                        <div class="gallery-section">
                            <div class="gallery-title">Hình ảnh trích xuất (${uniqueImages.length})</div>
                            <div class="gallery-grid">
                    `;
                    uniqueImages.forEach(img => {
                        galleryHtml += `
                            <div class="gallery-item" onclick="window.open('${img}', '_blank')">
                                <img src="${img}" class="gallery-img" alt="Ảnh trích xuất" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\\'http://www.w3.org/2000/svg\\' width=\\'200\\' height=\\'150\\' viewBox=\\'0 0 200 150\\'><rect width=\\'100%\\' height=\\'100%\\' fill=\\'%23f1f2f6\\'/><text x=\\'50%\\' y=\\'50%\\' font-family=\\'sans-serif\\' font-size=\\'12\\' fill=\\'%23747d8c\\' text-anchor=\\'middle\\' dominant-baseline=\\'middle\\'>Không tải được ảnh</text></svg>'">
                            </div>
                        `;
                    });
                    galleryHtml += `
                            </div>
                        </div>
                    `;
                }
            }

            // Breadcrumbs text
            const breadcrumbPath = page.url.replace('https://giacong.vn/', '').split('/').filter(Boolean);
            let breadcrumbsText = 'Trang chủ';
            if (breadcrumbPath.length > 0) {
                breadcrumbsText += ' » ' + breadcrumbPath.map(p => decodeURIComponent(p).replace(/-/g, ' ')).join(' » ');
            }

            contentEl.innerHTML = `
                <!-- Mock Header -->
                <div class="mock-header">
                    <div class="mock-logo">giacong<span>.vn</span></div>
                    <div class="mock-menu">
                        <div class="mock-menu-item" onclick="filterCategory('trang chủ')">Trang chủ</div>
                        <div class="mock-menu-item" onclick="filterCategory('sản phẩm')">Sản phẩm</div>
                        <div class="mock-menu-item" onclick="filterCategory('dịch vụ')">Dịch vụ</div>
                        <div class="mock-menu-item" onclick="filterCategory('liên hệ')">Liên hệ</div>
                    </div>
                    <div class="mock-hotline">
                        <svg width="14" height="14" fill="currentColor" viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
                        0947142999
                    </div>
                </div>

                <!-- Mock Body -->
                <div class="mock-body">
                    <div class="breadcrumbs">${breadcrumbsText}</div>
                    <h1 class="post-title-h1">${page.h1 || page.title}</h1>
                    <div class="post-category-tag">
                        <span class="badge ${getCategoryBadgeClass(page.category)}">${page.category}</span>
                    </div>
                    
                    <div class="post-content-container">
                        ${contentHtml}
                    </div>

                    ${contactsHtml}
                    
                    ${galleryHtml}
                </div>
            `;
            
            // Scroll to top of browser viewport
            contentEl.scrollTop = 0;
        }
    </script>
</body>
</html>
