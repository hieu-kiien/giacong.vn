services:
    laravel.test:
        profiles:
            - sail

    php:
        build:
            context: .
            dockerfile: docker/demo/php/Dockerfile
        environment:
            APP_ENV: local
            APP_DEBUG: '${APP_DEBUG:-false}'
            BOOST_ENABLED: 'false'
            DEBUGBAR_ENABLED: 'false'
            DB_CONNECTION: '${DB_CONNECTION:-mysql}'
            DB_HOST: mysql
            DB_PORT: 3306
            DB_DATABASE: '${DB_DATABASE}'
            DB_USERNAME: '${DB_USERNAME}'
            DB_PASSWORD: '${DB_PASSWORD}'
            CACHE_STORE: redis
            REDIS_HOST: redis
        volumes:
            - '.:/var/www/html'
            - 'bagisto_framework_cache:/var/www/html/storage/framework/cache'
            - 'bagisto_views:/var/www/html/storage/framework/views'
        networks:
            - sail
        depends_on:
            - mysql
            - redis

    nginx:
        image: nginx:1.27-alpine
        ports:
            - '${BAGISTO_PORT:-8081}:80'
        volumes:
            - '.:/var/www/html:ro'
            - './docker/demo/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro'
        networks:
            - sail
        depends_on:
            - php

volumes:
    bagisto_framework_cache:
    bagisto_views:
