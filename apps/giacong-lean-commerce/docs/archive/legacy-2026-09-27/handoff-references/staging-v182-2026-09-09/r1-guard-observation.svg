<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">Staging v182 R1 unsaved guard observation</title>
  <desc id="desc">Observed admin dirty navigation guard cases from a live staging browser session.</desc>
  <rect width="1440" height="820" fill="#f7f8fb"/>
  <rect x="34" y="28" width="1372" height="764" rx="22" fill="#ffffff" stroke="#d8dce8" stroke-width="2"/>
  <text x="72" y="86" font-family="Segoe UI, Arial, sans-serif" font-size="31" font-weight="700" fill="#27324b">Staging v182 · R1 dirty-navigation evidence</text>
  <text x="72" y="121" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#626b7c">Synthetic drafts only · no save/write · focus on guard close button</text>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="72" y="170" width="1296" height="92" rx="14" fill="#eef5ff" stroke="#b8d1f2"/>
    <text x="98" y="208" font-size="21" font-weight="700" fill="#234b7c">Sidebar / browser back / forward</text>
    <text x="98" y="240" font-size="17" fill="#3f4f65">Dialog: “Bỏ thay đổi chưa lưu?” · URL stays on editor · synthetic value retained · focus: “Đóng”</text>

    <rect x="72" y="286" width="1296" height="92" rx="14" fill="#eef8ee" stroke="#badfba"/>
    <text x="98" y="324" font-size="21" font-weight="700" fill="#2d6330">Discard route navigation</text>
    <text x="98" y="356" font-size="17" fill="#3f5b43">Returns to /admin/tin-tuc · editor unmounted · synthetic value absent</text>

    <rect x="72" y="402" width="1296" height="122" rx="14" fill="#fff7e9" stroke="#efd29a"/>
    <text x="98" y="440" font-size="21" font-weight="700" fill="#7a5517">Query/hash traversal</text>
    <text x="98" y="472" font-size="17" fill="#65532d">Stay preserves ?tab=b#beta and draft; discard returns ?tab=a#alpha</text>
    <text x="98" y="502" font-size="17" fill="#8a3f21">Observed limitation: same-page editor still shows “Chưa lưu” after query/hash discard</text>

    <rect x="72" y="548" width="1296" height="92" rx="14" fill="#f5efff" stroke="#d4bcec"/>
    <text x="98" y="586" font-size="21" font-weight="700" fill="#5a367a">Nested variant / media</text>
    <text x="98" y="618" font-size="17" fill="#5d4d69">Parent cancel opens guard; discard returns to product list and removes synthetic nested draft</text>

    <rect x="72" y="664" width="1296" height="82" rx="14" fill="#fff1f1" stroke="#ecc1c1"/>
    <text x="98" y="700" font-size="20" font-weight="700" fill="#8a3535">Admin runtime note</text>
    <text x="98" y="728" font-size="16" fill="#6d4545">One sanitized console entry: AbortError: Transition was skipped; no HTTP 400+ responses</text>
  </g>
</svg>
